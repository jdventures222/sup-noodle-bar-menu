<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Noto+Sans:wght@400;600;700&family=Noto+Sans+KR:wght@400;700&family=Noto+Sans+SC:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
  :root {
    --red: #E5342B; --red-deep: #B4231C;
    --ink: #1B1917; --body: #4A4542; --muted: #625B56;
    --ground: #F6F2ED; --surface: #FFFFFF; --line: #D8D0C8; --line-soft: #E9E3DC; --control: #837A74;
    --flag-bg: #FCEAE8; --amber: #9A5A0B; --amber-bg: #FFF3DE; --amber-line: #F0D3A3;
    --display: "Barlow Condensed", "Noto Sans", "Arial Narrow", Arial, sans-serif;
    --text: "Noto Sans", -apple-system, "Helvetica Neue", Arial, sans-serif;
    --maxw: 720px; --bar-h: 52px; --thumb: 84px; --ease: cubic-bezier(.2, .8, .2, 1);
  }
  html[lang="ko"] { --display: "Noto Sans", "Noto Sans KR", sans-serif; --text: "Noto Sans", "Noto Sans KR", sans-serif; }
  html[lang="zh-Hans"] { --display: "Noto Sans", "Noto Sans SC", sans-serif; --text: "Noto Sans", "Noto Sans SC", sans-serif; }
  html[lang="zh-Hant"] { --display: "Noto Sans", "Noto Sans TC", sans-serif; --text: "Noto Sans", "Noto Sans TC", sans-serif; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; background: var(--ground); }
  html.modal { overflow: hidden; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; } }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--text); font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
  html[lang="ko"] body { word-break: keep-all; }
  a { color: var(--red-deep); }
  button { font: inherit; color: inherit; }
  svg { display: block; }
  :focus-visible { outline: 3px solid var(--red-deep); outline-offset: 2px; }
  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 16px; }
  @media (min-width: 560px) { .wrap { padding: 0 24px; } }
  .skip { position: absolute; left: -9999px; top: 8px; background: var(--ink); color: #fff; padding: 8px 12px; border-radius: 6px; z-index: 50; }
  .skip:focus { left: 8px; }
  .caps { font-family: var(--display); text-transform: uppercase; letter-spacing: .05em; }
  html[lang="ko"] .caps, html[lang^="zh"] .caps { text-transform: none; letter-spacing: 0; }

  .brand { display: flex; align-items: center; gap: 12px; padding: 12px 0 12px; }
  .brand img { width: 48px; height: 48px; border-radius: 50%; flex: none; }
  .brand h1 { font-family: var(--display); text-transform: uppercase; font-weight: 800; font-size: 26px; line-height: 28px; margin: 0; }
  .brand p { margin: 1px 0 0; color: var(--muted); font-size: 13px; line-height: 18px; }

  /* Language switcher: every language visible in its own script, scrolls only if a narrow screen forces it. */
  .langbar { display: flex; gap: 3px; margin: 0 -16px; padding: 5px 16px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .langbar::-webkit-scrollbar { display: none; }
  @media (min-width: 560px) { .langbar { margin: 0 -24px; padding: 5px 24px; } }
  .seg { flex: 1 1 auto; min-width: max-content; display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 9px; border: 1px solid var(--line); background: var(--surface); color: var(--body); border-radius: 999px; font-size: 13px; line-height: 17px; font-weight: 600; white-space: nowrap; cursor: pointer; }
  @media (min-width: 420px) { .seg { padding: 0 14px; font-size: 14px; } }
  .seg[aria-checked="true"] { background: var(--red-deep); border-color: var(--red-deep); color: #fff; font-weight: 700; }
  .autodetect { margin: 0 0 10px; font-size: 12.5px; line-height: 17px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .autodetect svg { width: 14px; height: 14px; flex: none; color: var(--control); }

  /* Sticky bar */
  .bar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
  .bar .wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; padding-top: 4px; padding-bottom: 4px; }
  .row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; scroll-padding: 0 16px; margin: 0 -16px; padding: 0 16px; }
  .row::-webkit-scrollbar { display: none; }
  @media (min-width: 560px) { .row { margin: 0 -24px; padding: 0 24px; scroll-padding: 0 24px; } }
  .row > * { flex: none; }
  .row .sep { width: 1px; background: var(--line); align-self: stretch; margin: 10px 4px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 44px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 0 14px; font-size: 14px; line-height: 18px; font-weight: 600; cursor: pointer; white-space: nowrap; color: var(--ink); text-decoration: none; }
  .chip[aria-current] { background: var(--red-deep); color: #fff; border-color: var(--red-deep); }
  .chip.tool { background: var(--ground); border-color: var(--ground); }
  .chip.tool svg { width: 17px; height: 17px; color: var(--red-deep); }
  .chip.tool.on { background: var(--red-deep); border-color: var(--red-deep); color: #fff; }
  .chip.tool.on svg { color: #fff; }
  .chip .count { display: inline-grid; place-items: center; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; background: #fff; color: var(--red-deep); font-size: 12px; font-weight: 700; }
  .summary { display: flex; align-items: flex-start; gap: 8px; min-width: 0; font-size: 13px; line-height: 18px; color: var(--body); padding-bottom: 2px; }
  .summary b { color: var(--red-deep); }
  .summary .grow { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; font: inherit; color: inherit; }
  .linkbtn { background: none; border: 0; padding: 0 2px; min-height: 18px; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; color: var(--red-deep); font-size: 13px; font-weight: 600; white-space: nowrap; }

  /* Buttons and pills */
  .pill { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; border: 1px solid var(--control); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 14px; line-height: 20px; font-weight: 600; cursor: pointer; white-space: nowrap; color: var(--ink); }
  .pill[aria-pressed="true"] { background: var(--red-deep); color: #fff; border-color: var(--red-deep); }
  .pill.ghost { border-color: var(--line); }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; border: 0; border-radius: 12px; padding: 0 18px; font-size: 16px; font-weight: 700; cursor: pointer; background: var(--red-deep); color: #fff; }
  .btn.quiet { background: var(--ground); color: var(--ink); }

  /* Specials */
  .specials { display: grid; gap: 10px; margin: 14px 0 0; grid-template-columns: 1fr; }
  @media (min-width: 560px) { .specials { grid-template-columns: 1fr 1fr; gap: 12px; } }
  .special { display: grid; grid-template-columns: 84px minmax(0, 1fr) 20px; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; color: inherit; text-decoration: none; }
  .special:active { background: var(--ground); }
  .special img { width: 84px; height: 84px; object-fit: cover; border-radius: 10px; display: block; }
  .special .eyebrow { font-family: var(--display); text-transform: uppercase; font-weight: 700; font-size: 12px; line-height: 14px; letter-spacing: .06em; color: var(--red-deep); }
  html[lang="ko"] .special .eyebrow, html[lang^="zh"] .special .eyebrow { text-transform: none; letter-spacing: 0; }
  .special h2 { font-family: var(--display); text-transform: uppercase; font-weight: 800; font-size: 21px; line-height: 23px; margin: 2px 0 3px; text-wrap: balance; }
  html[lang="ko"] .special h2, html[lang^="zh"] .special h2 { text-transform: none; font-size: 18px; line-height: 24px; }
  .special .price { font-size: 16px; line-height: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .special .price s { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .special .when { font-size: 13px; line-height: 18px; color: var(--body); margin: 1px 0 0; }
  .special .terms { font-size: 12px; line-height: 16px; color: var(--muted); margin: 3px 0 0; }
  .special svg { width: 20px; height: 20px; color: var(--control); }

  /* Allergen call-to-action strip */
  .cta { display: grid; grid-template-columns: 24px minmax(0, 1fr) 20px; gap: 12px; align-items: center; width: 100%; text-align: left; margin: 12px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 12px 12px 14px; cursor: pointer; }
  .cta:active { background: var(--ground); }
  .cta > svg:first-child { width: 24px; height: 24px; color: var(--red-deep); }
  .cta > svg:last-child { width: 20px; height: 20px; color: var(--control); }
  .cta b { display: block; font-size: 15px; line-height: 20px; }
  .cta small { display: block; font-size: 13px; line-height: 18px; color: var(--muted); }
  .cta.on { border-color: var(--red-deep); box-shadow: inset 0 0 0 1px var(--red-deep); }
  .cta.on b { color: var(--red-deep); }

  /* Sections and items */
  section.menu { margin: 28px 0 0; scroll-margin-top: calc(var(--bar-h) + 8px); }
  section.menu > header { border-bottom: 2px solid var(--ink); padding-bottom: 5px; }
  section.menu h2 { font-family: var(--display); text-transform: uppercase; font-weight: 800; color: var(--red); font-size: 28px; line-height: 30px; margin: 0; }
  html[lang="ko"] section.menu h2, html[lang^="zh"] section.menu h2 { text-transform: none; font-size: 24px; line-height: 30px; }
  .intro { color: var(--body); margin: 10px 0 0; max-width: 62ch; font-size: 15px; line-height: 22px; }
  .intro.small { font-size: 13px; line-height: 19px; color: var(--muted); margin-top: 4px; }
  .items { list-style: none; margin: 0; padding: 0; }
  .item { padding: 14px 0; border-bottom: 1px solid var(--line); scroll-margin-top: calc(var(--bar-h) + 8px); }
  .item.flagged { background: var(--flag-bg); box-shadow: inset 3px 0 0 var(--red-deep); border-radius: 10px; margin: 2px -10px; padding-left: 12px; padding-right: 10px; border-bottom-color: transparent; }
  .hide-flagged .item.flagged { display: none; }
  .has-photos .item { display: grid; grid-template-columns: minmax(0, 1fr) var(--thumb); gap: 12px; align-items: start; }
  .compact { --thumb: 72px; }
  @media (min-width: 560px) { section.menu { --thumb: 112px; } .compact { --thumb: 88px; } .has-photos .item { gap: 16px; } }
  .item-body { min-width: 0; }
  .thumb-btn { display: block; width: var(--thumb); height: var(--thumb); padding: 0; border: 0; background: none; border-radius: 12px; cursor: zoom-in; transition: transform .15s var(--ease); }
  .thumb-btn:active { transform: scale(.95); }
  .thumb { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; background: var(--line-soft); display: block; box-shadow: inset 0 0 0 1px rgba(27, 25, 23, .06); }
  .thumb.cutout { object-fit: contain; background: transparent; border-radius: 0; box-shadow: none; }
  .item-head { display: grid; grid-template-columns: minmax(0, 1fr) max-content; gap: 10px; align-items: baseline; }
  .item h3 { font-family: var(--display); text-transform: uppercase; font-weight: 700; font-size: 21px; line-height: 24px; margin: 0; min-width: 0; }
  html[lang="ko"] .item h3, html[lang^="zh"] .item h3 { text-transform: none; font-size: 18px; line-height: 24px; }
  .price { font-family: var(--text); font-weight: 700; font-size: 16px; line-height: 22px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .en-name { font-size: 13px; line-height: 18px; color: var(--muted); margin: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 5px 0 0; }
  .badge { font-family: var(--display); text-transform: uppercase; font-weight: 700; font-size: 12px; line-height: 16px; letter-spacing: .06em; color: var(--red-deep); border: 1px solid var(--red-deep); border-radius: 4px; padding: 2px 6px; }
  .badge.lunch { color: #fff; background: var(--red-deep); }
  .badge.refill { color: var(--body); border-color: var(--control); }
  html[lang="ko"] .badge, html[lang^="zh"] .badge { text-transform: none; letter-spacing: 0; }
  .tagline { margin: 3px 0 0; font-style: italic; color: var(--muted); font-size: 14px; line-height: 20px; }
  .desc { margin: 4px 0 0; color: var(--body); max-width: 62ch; font-size: 15px; line-height: 22px; }
  @media (min-width: 560px) { .desc { font-size: 16px; line-height: 24px; } }
  .variants { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; }
  .variants li { display: grid; grid-template-columns: minmax(0, 1fr) max-content; gap: 10px; align-items: baseline; font-weight: 600; font-size: 15px; line-height: 22px; }
  .variants .vplus { font-weight: 400; color: var(--body); font-size: 13px; }
  .note { margin: 8px 0 0; font-size: 14px; line-height: 20px; color: var(--body); padding-left: 10px; border-left: 2px solid var(--red-deep); }
  .sides { margin: 10px 0 0; padding: 8px 0 0; border-top: 1px dotted var(--line); }
  .lab { font-family: var(--display); text-transform: uppercase; letter-spacing: .05em; font-size: 13px; line-height: 19px; font-weight: 700; color: var(--muted); }
  html[lang="ko"] .lab, html[lang^="zh"] .lab { text-transform: none; letter-spacing: 0; }
  .al { margin: 7px 0 0; font-size: 13px; line-height: 19px; color: var(--body); }
  /* The photo column is too narrow to hold the line, so it takes its own row and
     shrinks to fit against the right edge, sitting under the photo. */
  .has-photos .item > .al { grid-column: 1 / -1; justify-self: end; text-align: right; max-width: 100%; margin-top: 2px; }
  .al b { font-weight: 600; color: var(--ink); }
  .al mark { background: transparent; color: var(--red-deep); font-weight: 700; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 2px; }
  .addons { border: 2px solid var(--red); border-radius: 12px; padding: 10px 14px 4px; margin: 16px 0 0; }
  .addons > h3 { font-family: var(--display); text-transform: uppercase; font-weight: 800; color: var(--red-deep); font-size: 18px; line-height: 22px; margin: 0 0 2px; }
  html[lang="ko"] .addons > h3, html[lang^="zh"] .addons > h3 { text-transform: none; }
  .addons .item { padding: 10px 0; }
  /* Nothing in this block has a photo, so it must not reserve the photo column. */
  .has-photos .addons .item { grid-template-columns: minmax(0, 1fr); }
  .has-photos .addons .item > .al { margin-top: 7px; }
  .addons .item.flagged { margin: 2px -8px; padding-left: 10px; padding-right: 8px; }
  .addons .item:last-child { border-bottom: 0; }
  .addons .item h3 { font-size: 18px; line-height: 22px; }
  .empty { margin: 12px 0 0; font-size: 14px; line-height: 20px; color: var(--muted); font-style: italic; }

  /* Footer */
  footer.end { margin: 36px 0 0; background: var(--surface); border-top: 1px solid var(--line); }
  footer.end .wrap { padding-top: 22px; padding-bottom: calc(30px + env(safe-area-inset-bottom)); }
  .notice { font-size: 14px; line-height: 20px; color: var(--body); max-width: 66ch; margin: 0 0 14px; }
  .notice b { display: block; font-family: var(--display); text-transform: uppercase; letter-spacing: .05em; font-size: 13px; color: var(--ink); margin-bottom: 2px; }
  html[lang="ko"] .notice b, html[lang^="zh"] .notice b { text-transform: none; letter-spacing: 0; }
  .locs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 18px 0 22px; padding-top: 16px; border-top: 2px solid var(--ink); }
  .locs h3 { font-family: var(--display); text-transform: uppercase; font-weight: 800; color: var(--red); font-size: 20px; line-height: 24px; margin: 0 0 2px; }
  .locs address { font-style: normal; font-size: 14px; line-height: 20px; color: var(--body); }
  .locs a { text-decoration: none; display: inline-block; padding: 6px 0; }
  .fine { margin: 18px 0 0; font-size: 13px; line-height: 19px; color: var(--muted); }
  .pdfs { margin: 18px 0 0; font-size: 14px; line-height: 24px; color: var(--body); }
  .pdfs a { font-weight: 600; display: inline-block; padding: 5px 0; }

  /* Sheets (language, allergen filter) */
  dialog { color: inherit; }
  dialog.sheet { position: fixed; inset: auto 0 0 0; margin: 0; width: 100%; max-width: 100%; max-height: min(88dvh, 88vh); border: 0; border-radius: 18px 18px 0 0; padding: 0; background: var(--surface); box-shadow: 0 -8px 40px rgba(27, 25, 23, .18); overflow: hidden; display: none; flex-direction: column; transform: translateY(102%); transition: transform .32s var(--ease); }
  dialog.sheet[open] { display: flex; transform: none; }
  dialog.sheet.closing { transform: translateY(102%); }
  dialog.sheet::backdrop { background: rgba(27, 25, 23, .48); transition: opacity .32s; }
  dialog.sheet.closing::backdrop { opacity: 0; }
  @starting-style { dialog.sheet[open] { transform: translateY(102%); } dialog.sheet[open]::backdrop { opacity: 0; } }
  @media (min-width: 720px) {
    dialog.sheet { inset: 0; margin: auto; width: min(480px, 92vw); max-height: min(80dvh, 80vh); border-radius: 18px; transform: translateY(16px) scale(.98); opacity: 0; transition: transform .26s var(--ease), opacity .26s; }
    dialog.sheet[open] { transform: none; opacity: 1; }
    dialog.sheet.closing { transform: translateY(16px) scale(.98); opacity: 0; }
    @starting-style { dialog.sheet[open] { transform: translateY(16px) scale(.98); opacity: 0; } }
  }
  .sheet-head { display: grid; grid-template-columns: minmax(0, 1fr) 44px; align-items: center; gap: 8px; padding: 14px 8px 8px 20px; flex: none; }
  .sheet-head::before { content: ""; position: absolute; top: 8px; left: 50%; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: var(--line); }
  @media (min-width: 720px) { .sheet-head::before { display: none; } }
  .sheet-head h2 { font-family: var(--display); text-transform: uppercase; font-weight: 800; font-size: 24px; line-height: 28px; margin: 6px 0 0; }
  html[lang="ko"] .sheet-head h2, html[lang^="zh"] .sheet-head h2 { text-transform: none; font-size: 20px; }
  .x { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; border-radius: 50%; cursor: pointer; color: var(--body); }
  .x span { width: 32px; height: 32px; border-radius: 50%; background: var(--ground); display: grid; place-items: center; }
  .x svg { width: 16px; height: 16px; }
  .sheet-body { overflow-y: auto; overscroll-behavior: contain; padding: 6px 20px calc(20px + env(safe-area-inset-bottom)); flex: 1 1 auto; }
  .sheet-hint { margin: 0 0 12px; font-size: 14px; line-height: 20px; color: var(--body); }
  .opts { display: grid; margin: 0 -8px; }
  .opt { display: grid; grid-template-columns: minmax(0, 1fr) 24px; align-items: center; gap: 12px; width: 100%; text-align: left; min-height: 56px; padding: 8px 12px; border: 0; background: none; border-radius: 12px; cursor: pointer; }
  .opt:active { background: var(--ground); }
  .opt .native { display: block; font-size: 17px; line-height: 22px; font-weight: 600; }
  .opt .eng { display: block; font-size: 13px; line-height: 18px; color: var(--muted); }
  .opt svg { width: 24px; height: 24px; color: var(--red-deep); visibility: hidden; }
  .opt[aria-checked="true"] svg { visibility: visible; }
  .opt[aria-checked="true"] .native { color: var(--red-deep); }
  .avoid { display: flex; flex-wrap: wrap; gap: 8px; }
  .sheet-status { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin: 14px 0 0; font-size: 14px; line-height: 20px; color: var(--body); }
  .sheet-status .status { font-weight: 600; color: var(--ink); }
  .sheet-foot { position: sticky; bottom: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; padding: 12px 0 0; margin-top: 16px; background: var(--surface); box-shadow: 0 -12px 12px -6px var(--surface); }
  .sheet-foot .btn.quiet { padding: 0 16px; }

  /* Photo viewer */
  dialog.lb { position: fixed; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: transparent; color: #fff; overflow: hidden; display: none; }
  dialog.lb[open] { display: block; }
  dialog.lb::backdrop { background: transparent; }
  .lb-bg { position: absolute; inset: 0; background: #000; opacity: 0; }
  .lb-track { position: absolute; inset: 0; display: flex; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
  .lb-track.zoomed { cursor: move; }
  .lb-slide { flex: 0 0 100%; width: 100%; height: 100%; display: grid; place-items: center; overflow: hidden; }
  .lb-zoom { position: relative; transform-origin: center; background-position: center; background-size: cover; overflow: hidden; }
  .lb-zoom img { display: block; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .25s; pointer-events: none; -webkit-user-drag: none; }
  .lb-zoom img.in { opacity: 1; }
  .lb-zoom.cutout { background-image: none !important; }
  .lb-zoom.cutout img { object-fit: contain; }
  .lb-chrome { position: absolute; inset: 0; pointer-events: none; transition: opacity .2s ease-in-out; }
  .lb-chrome.off > * { pointer-events: none !important; }
  .lb-close { pointer-events: auto; position: absolute; top: calc(10px + env(safe-area-inset-top)); left: calc(10px + env(safe-area-inset-left)); width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 0; cursor: pointer; }
  .lb-close span { width: 34px; height: 34px; border-radius: 50%; background: rgba(0, 0, 0, .35); display: grid; place-items: center; }
  .lb-close svg { width: 14px; height: 14px; }
  .lb-cap { position: absolute; left: 16px; right: 16px; bottom: calc(24px + env(safe-area-inset-bottom)); display: flex; justify-content: center; }
  .lb-cap span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: rgba(0, 0, 0, .55); border-radius: 999px; padding: 7px 14px; font-size: 14px; line-height: 20px; font-weight: 600; }
  .lb-cap span b { font-weight: 700; margin-left: 8px; font-variant-numeric: tabular-nums; }
  .lb-nav { display: none; pointer-events: auto; position: absolute; top: 50%; width: 44px; height: 44px; margin-top: -22px; place-items: center; background: none; border: 0; cursor: pointer; }
  .lb-nav span { width: 38px; height: 38px; border-radius: 50%; background: rgba(0, 0, 0, .35); display: grid; place-items: center; }
  .lb-nav svg { width: 18px; height: 18px; }
  .lb-nav.prev { left: 12px; } .lb-nav.next { right: 12px; }
  .lb-nav[disabled] { opacity: .3; cursor: default; }
  @media (hover: hover) and (pointer: fine) { .lb-nav { display: grid; } }
  .lb-close:focus-visible span, .lb-nav:focus-visible span { outline: 3px solid #fff; outline-offset: 2px; }
  .lb-close:focus-visible, .lb-nav:focus-visible { outline: 0; }

  @media print { .bar, .cta, .skip, dialog { display: none !important; } body { background: #fff; } .thumb-btn { pointer-events: none; } }
</style>

{"en":{"ui.title":"SUP Noodle Bar Menu","ui.brand":"SUP Noodle Bar","ui.tagline":"Vietnamese noodle bar in Buena Park and Irvine","ui.language":"Language","ui.jumpTo":"Jump to","ui.specials":"Specials","ui.avoiding":"I'm avoiding","ui.avoidHint":"Tap an allergen to flag every dish that contains it.","ui.hideFlagged":"Hide flagged dishes","ui.showFlagged":"Show flagged dishes","ui.clear":"Clear","ui.flaggedCount":"{n} dishes flagged","ui.contains":"Contains","ui.likely":"Likely contains","ui.noneListed":"No major allergens listed","ui.legendTitle":"Reading the allergen tags","ui.legendStated":"Named in the dish description.","ui.legendLikely":"Usual for this preparation. Ask your server to confirm.","ui.addons":"Make it yours","ui.sides":"Add a side","ui.new":"New","ui.bestSeller":"Best seller","ui.chefsChoice":"Chef's choice","ui.seasonal":"Seasonal","ui.lunch":"Lunch special","ui.freeRefill":"Free refills","ui.refillsNote":"Free refills on drinks marked with the refill tag.","ui.lunchEyebrow":"Seasonal offer","ui.lunchTitle":"Beef Belly Pho lunch special","ui.lunchWhen":"Monday to Friday, 10 AM to 4 PM","ui.lunchTerms":"Dine-in only, excluding holidays. Valid at all SUP Noodle Bar locations. Add-ons and extras cost extra. Limited time only.","ui.lunchRegular":"Regular price","ui.unlimitedRefill":"Unlimited noodle refill","ui.kimchiEyebrow":"Now available","ui.kimchiTitle":"Kimchi Fried Rice","ui.kimchiSub":"With Spam, soft tofu, or filet mignon","ui.seeItem":"See item","ui.dineInOnly":"Dine-in only","ui.locations":"Find us","ui.buenaPark":"Buena Park","ui.irvine":"Irvine","ui.allergyTitle":"Allergies and dietary needs","ui.allergyNotice":"Please tell your server about any dietary restrictions or food allergies. We strongly advise guests with severe food allergies or sensitivities to exercise caution when dining at SUP. We make every effort to accommodate food allergies and keep our guests safe, but cross-contamination is always possible and we cannot guarantee an allergen-free environment. If you have any questions, please ask your server.","ui.rawTitle":"Undercooked food notice","ui.rawNotice":"Consuming raw or undercooked eggs, meat, poultry, seafood, or shellfish may increase the risk of foodborne illness, especially for those with certain medical conditions. Dishes prepared with soft-boiled, poached, sunny-side-up, or over-easy eggs, as well as rare or medium-rare steaks, may be undercooked. Please tell your server about any concerns.","ui.phoRefill":"Free unlimited noodle refills with dine-in pho.","allergen.milk":"Dairy","allergen.egg":"Egg","allergen.fish":"Fish","allergen.shellfish":"Shellfish","allergen.peanut":"Peanut","allergen.treenut":"Tree nuts","allergen.gluten":"Gluten","allergen.soy":"Soy","allergen.sesame":"Sesame","sec.appetizers.title":"Appetizers","sec.pho.title":"Pho","sec.pho.intro":"Thin rice noodles served in beef bone broth, garnished with white onions, scallions, and cilantro. Free unlimited noodle refills with dine-in pho.","sec.pho.brothNote":"Every pho, including the veggie and tofu bowl, is made with beef bone broth.","sec.plates.title":"Rice and noodle plates","sec.extras.title":"Extras","sec.kids.title":"Kids","sec.drinks.title":"Drinks","item.bao.name":"Golden Bao","item.bao.tagline":"Fried pork dumpling","item.bao.desc":"Ground pork shoulder, caramelized onions, mushrooms, and a hard-boiled egg, wrapped in homemade dough and fried to a crisp.","item.bao.price.three":"Three baos","item.bao.price.one":"One bao","item.springroll.name":"Spring Roll","item.springroll.tagline":"Shrimp","item.springroll.desc":"Fresh bean sprouts, mint, lettuce, and vermicelli wrapped in rice paper. Served with peanut sauce.","item.eggrolls.name":"Egg Rolls","item.eggrolls.desc":"Ground pork, mushrooms, onions, carrots, and glass noodles, deep-fried until crispy. Served with pickled carrots, vermicelli, lettuce, and sweet and sour fish sauce.","item.eggrolls.price.three":"Three rolls","item.eggrolls.price.extra":"Add one roll (four rolls total)","item.shakenfries.name":"Shaken House Fries","item.shakenfries.desc":"Colossal crisp fries topped with shaken beef belly, garlic, caramelized onions, sharp cheddar cheese, and spicy tartar sauce.","item.trufflefries.name":"Truffle Fries","item.trufflefries.desc":"Colossal crisp fries tossed with fresh herbs, parmesan cheese, and Italian truffle oil. Served with spicy aji verde aioli, ketchup, and spicy mayo.","item.parmfries.name":"Parmesan Fries","item.parmfries.desc":"Colossal crisp fries tossed in fresh herbs and garlic, topped with parmesan cheese. Served with spicy aji verde aioli, ketchup, and spicy mayo.","item.wings.name":"Chicken Wings","item.wings.desc":"Crispy fried chicken wings, your choice of garlic or parmesan.","item.wings.note":"The parmesan wings contain dairy.","item.wings.price.garlic":"Garlic","item.wings.price.parmesan":"Parmesan","item.nuggets.name":"Chicken Nugget Basket","item.nuggets.desc":"Crispy nuggets with colossal crisp fries, ketchup, and spicy mayo.","item.phoshortrib.name":"Pho Short Rib","item.phoshortrib.tagline":"Boneless","item.phoshortrib.desc":"Thinly sliced boneless short rib, rich in flavor and melt-in-your-mouth tender.","item.phoribbones.name":"Pho Rib Bones","item.phoribbones.tagline":"Two bones","item.phoribbones.desc":"Fall-off-the-bone beef ribs, braised for four hours for a deep, hearty flavor.","item.phobeefbelly.name":"Pho Beef Belly","item.phobeefbelly.desc":"Thinly sliced marbled beef belly.","item.phobeefbelly.note":"Weekday lunch special: $11.99, dine-in only, 10 AM to 4 PM.","item.phofilet.name":"Pho Filet Mignon","item.phofilet.desc":"Lean filet mignon, tender and flavorful.","item.phocombo.name":"Pho Combination","item.phocombo.desc":"A mix of beef belly, tendon, brisket, meatball, and one rib bone.","item.phocombo.note":"No meat substitutions.","item.phoveggie.name":"Pho Veggie and Tofu","item.phoveggie.desc":"Tofu, broccoli, carrots, and napa cabbage in a rich beef broth.","item.phoveggie.note":"Made with beef broth, so this bowl is not vegetarian.","item.phobrisket.name":"Pho Brisket","item.phobrisket.desc":"Four-hour-braised brisket, tender with a slight chew.","item.phoshrimp.name":"Pho Shrimp","item.phoshrimp.desc":"Large poached shrimp, light and fresh.","item.phomeatballs.name":"Pho Meatballs","item.phomeatballs.desc":"Vietnamese tendon meatballs.","item.phobourdain.name":"Pho Anthony Bourdain","item.phobourdain.desc":"Wok-seared scallions, red onions, and minced garlic with filet mignon and flat noodles. Smoky and packed with flavor.","item.drynoodle.name":"Beef Belly Dry Noodle","item.drynoodle.desc":"Stir-fried beef belly in lemongrass sauce, served over fresh spring mix, vegetables, and flat noodles. Garnished with roasted peanuts, fried shallots, and fresh herbs. Served dry, without soup.","addon.shaken.name":"Make your pho shaken style","addon.shaken.desc":"Wok-seared garlic, scallions, and red onions in bone marrow oil. Adds a depth of smokiness for a distinct northern-style flavor.","addon.sousvide.name":"Add a sous vide egg","addon.sousvide.desc":"Slow-poached egg that adds a milky richness to your broth.","addon.mala.name":"Add a numbing sensation","addon.mala.desc":"House-made mala chili oil.","addon.spicy.name":"Make your pho spicy","addon.spicy.desc":"House-made chili paste with lemongrass.","item.lomo.name":"Lomo Saltado","item.lomo.desc":"Thick-cut fries, charred sweet red onions, tomatoes, and white wine soy with your choice of protein and steamed white rice. Served with house-made spicy aji verde aioli.","item.lomo.note":"The shrimp plate contains shellfish. The aioli is usually egg-based, so ask your server about the vegan tofu plate.","item.lomo.price.filet":"Filet mignon","item.lomo.price.shrimp":"Shrimp","item.lomo.price.tofu":"Vegan tofu","addon.lomofriedegg.name":"Fried egg","addon.lomosoftegg.name":"Soft-boiled egg","item.cajun.name":"Cajun Garlic Noodles","item.cajun.desc":"Wheat noodles tossed in butter and Cajun garlic sauce, finished with fresh scallions. Served with house-made spicy aji verde aioli.","item.cajun.note":"The shrimp and sausage plate contains shellfish.","item.cajun.price.shrimpsausage":"Shrimp and sausage","item.cajun.price.filet":"Filet mignon","item.friedrice.name":"Fried Rice","item.friedrice.desc":"Your choice of protein with scrambled eggs and scallions. Served with house-made spicy aji verde aioli on the side.","item.friedrice.note":"The shrimp plate contains shellfish. Tofu plates contain soy. Chicken wings are breaded with wheat.","item.friedrice.price.shrimp":"Shrimp","item.friedrice.price.spam":"Spam","item.friedrice.price.wings":"Chicken wings","item.friedrice.price.filet":"Filet mignon","item.friedrice.price.softtofu":"Soft tofu","item.friedrice.price.friedtofu":"Fried tofu","item.kimchi.name":"Kimchi Fried Rice","item.kimchi.desc":"The house fried rice tossed with kimchi, with scrambled eggs and scallions. Served with house-made spicy aji verde aioli on the side.","item.kimchi.note":"Kimchi is usually fermented with fish sauce and salted shrimp. The soft tofu plate contains soy.","item.kimchi.price.spam":"Spam","item.kimchi.price.softtofu":"Soft tofu","item.kimchi.price.filet":"Filet mignon","item.sidenoodles.name":"Side of Noodles","item.sidenoodles.desc":"Unlimited with dine-in pho orders.","item.sidebroth.name":"Side of Broth","item.siderice.name":"Side of Rice","item.friedegg.name":"Fried Egg","item.poachedegg.name":"Slow Poached Egg","item.soybutter.name":"Soy and Butter Noodle","item.kidsbox.name":"Kids Meal Box","item.kidsbox.desc":"Crispy golden chicken nuggets and seasoned fries, with a juice box to complete the meal.","item.yuzupeach.name":"Yuzu Peach","item.herbaltea.name":"Herbal Iced Tea","item.herbaltea.desc":"A blend of pandan and artichoke.","item.thaitea.name":"Thai Iced Tea","item.thaitea.desc":"Sweet and creamy with strong black tea notes.","item.lychee.name":"Lychee Lemonade or Soda","item.lychee.desc":"Blended lychee with lemonade or soda.","item.vietcoffee.name":"Vietnamese Iced Coffee","item.strawberrysoda.name":"Strawberry Cream Soda","item.watermelon.name":"Watermelon Refresher","item.passionfruit.name":"Passionfruit Green Tea","item.passionfruit.desc":"Jasmine green tea and passionfruit purée.","item.fountain.name":"Fountain Drink","item.fountain.desc":"Coke, Diet Coke, Coke Zero, Fanta Strawberry, Ginger Ale, Barq's Root Beer, Sprite, or Lemonade.","item.shirley.name":"Shirley Temple","item.royrogers.name":"Roy Rogers","item.jasmineiced.name":"Jasmine Iced Tea","item.jasminehot.name":"Jasmine Hot Tea","ui.skip":"Skip to menu","ui.allergens":"Allergens","ui.matchAny":"Dishes that contain any selected allergen are flagged.","ui.chooseAllergens":"Choose allergens to avoid","ui.sectionHidden":"Every dish in this section is hidden by your allergen filter.","ui.printKey":"Each dish lists the major allergens it contains: dairy, egg, fish, shellfish, peanut, tree nuts, gluten, soy, and sesame. Options that add an allergen show it next to the option.","ui.noLineNote":"Dishes with no major allergen listed show no Contains line.","ui.pdfMenu":"Printable menu (PDF)","ui.filterCta":"Avoiding an allergen?","ui.filterCtaSub":"Tap to flag every dish that contains it.","ui.done":"Done","ui.close":"Close","ui.photoOf":"Photo of {name}","ui.photoViewer":"Dish photo","ui.prevPhoto":"Previous photo","ui.nextPhoto":"Next photo","ui.langName.en":"English","ui.langName.es":"Spanish","ui.langName.vi":"Vietnamese","ui.langName.ko":"Korean","ui.langName.zh":"Chinese (Simplified)","ui.hide":"Hide","ui.show":"Show","ui.autoDetected":"Shown in your device's language.","ui.chooseLanguage":"Choose a language","ui.langName.zh-Hant":"Chinese (Traditional)","ui.langName.tl":"Tagalog"},"es":{"ui.title":"Menú de SUP Noodle Bar","ui.brand":"SUP Noodle Bar","ui.tagline":"Restaurante de fideos vietnamitas en Buena Park e Irvine","ui.language":"Idioma","ui.jumpTo":"Ir a","ui.specials":"Especiales","ui.avoiding" ientes, pero la contaminación cruzada siempre es posible y no podemos garantizar un ambiente libre de alérgenos. Si tienes alguna pregunta, consulta a tu mesero.","ui.rawTitle":"Aviso sobre alimentos poco cocidos","ui.rawNotice":"Consumir huevos, carne, aves, pescados o mariscos crudos o poco cocidos puede aumentar el riesgo de enfermedades transmitidas por alimentos, especialmente en personas con ciertas afecciones médicas. Los platillos preparados con huevos tibios, pochados, estrellados sin voltear o fritos por ambos lados con la yema líquida, así como los cortes de carne en término rojo o medio rojo, pueden estar poco cocidos. Por favor, comunica cualquier inquietud a tu mesero.","ui.phoRefill":"Refill gratis e ilimitado de fideos al pedir pho para comer aquí.","allergen.milk":"Lácteos","allergen.egg":"Huevo","allergen.fish":"Pescado","allergen.shellfish":"Mariscos","allergen.peanut":"Cacahuate","allergen.treenut":"Nueces de árbol","allergen.gluten":"Gluten","allergen.soy":"Soya","allergen.sesame":"Ajonjolí","sec.appetizers.title":"Entradas","sec.pho.title":"Pho","sec.pho.intro":"Fideos de arroz delgados servidos en caldo de hueso de res, con cebolla blanca, cebollín y cilantro. Refill gratis e ilimitado de fideos al pedir pho para comer aquí.","sec.pho.brothNote":"Todos los pho, incluido el de verduras y tofu, se preparan con caldo de hueso de res.","sec.plates.title":"Platos de arroz y fideos","sec.extras.title":"Extras","sec.kids.title":"Niños","sec.drinks.title":"Bebidas","item.bao.name":"Bao dorado","item.bao.tagline":"Bao frito relleno de cerdo","item.bao.desc":"Carne molida de espaldilla de cerdo, cebolla caramelizada, champiñones y huevo cocido, envueltos en masa casera y fritos hasta quedar crujientes.","item.bao.price.three":"Tres baos","item.bao.price.one":"Un bao","item.springroll.name":"Rollo primavera fresco","item.springroll.tagline":"Camarón","item.springroll.desc":"Brotes frescos de frijol, menta, lechuga y fideos finos envueltos en papel de arroz. Se sirve con salsa de cacahuate.","item.eggrolls.name":"Rollos fritos","item.eggrolls.desc":"Rollos rellenos de carne molida de cerdo, champiñones, cebolla, zanahoria y fideos de cristal, fritos en abundante aceite hasta quedar crujientes. Se sirven con zanahoria encurtida, fideos finos, lechuga y salsa de pescado agridulce.","item.eggrolls.price.three":"Tres rollos","item.eggrolls.price.extra":"Rollo adicional (cuatro rollos en total)","item.shakenfries.name":"Papas de la casa con res salteada","item.shakenfries.desc":"Papas fritas gruesas y crujientes cubiertas con panceta de res salteada, ajo, cebolla caramelizada, queso cheddar de sabor intenso y salsa tártara picante.","item.trufflefries.name":"Papas con trufa","item.trufflefries.desc":"Papas fritas gruesas y crujientes con hierbas frescas, queso parmesano y aceite de trufa italiano. Servidas con alioli picante de ají verde, cátsup y mayonesa picante.","item.parmfries.name":"Papas con parmesano","item.parmfries.desc":"Papas fritas gruesas y crujientes con hierbas frescas y ajo, cubiertas con queso parmesano. Servidas con alioli picante de ají verde, cátsup y mayonesa picante.","item.wings.name":"Alitas de pollo","item.wings.desc":"Alitas de pollo fritas y crujientes, a elegir con ajo o parmesano.","item.wings.note":"Las alitas con parmesano contienen lácteos.","item.wings.price.garlic":"Ajo","item.wings.price.parmesan":"Parmesano","item.nuggets.name":"Canasta de nuggets de pollo","item.nuggets.desc":"Nuggets crujientes con papas fritas gruesas y crujientes, cátsup y mayonesa picante.","item.phoshortrib.name":"Pho de costilla corta de res","item.phoshortrib.tagline":"Sin hueso","item.phoshortrib.desc":"Costilla corta de res sin hueso en rebanadas finas, llena de sabor y tan suave que se deshace en la boca.","item.phoribbones.name":"Pho de costillas con hueso","item.phoribbones.tagline":"Dos huesos","item.phoribbones.desc":"Costillas de res cocidas a fuego lento durante cuatro horas, de sabor intenso y con carne tan suave que se desprende del hueso.","item.phobeefbelly.name":"Pho de panceta de res","item.phobeefbelly.desc":"Panceta de res marmoleada en rebanadas finas.","item.phobeefbelly.note":"Especial de almuerzo entre semana: $11.99, solo para comer aquí, de 10 a. m. a 4 p. m.","item.phofilet.name":"Pho de filet mignon","item.phofilet.desc":"Filet mignon magro, suave y lleno de sabor.","item.phocombo.name":"Pho combinado","item.phocombo.desc":"Una mezcla de panceta de res, tendón, pecho de res, albóndiga y una costilla con hueso.","item.phocombo.note":"No se permiten sustituciones de carne.","item.phoveggie.name":"Pho de verduras y tofu","item.phoveggie.desc":"Tofu, brócoli, zanahoria y col napa en un sustancioso caldo de res.","item.phoveggie.note":"Se prepara con caldo de res, por lo que este plato no es vegetariano.","item.phobrisket.name":"Pho de pecho de res","item.phobrisket.desc":"Pecho de res cocido a fuego lento durante cuatro horas, suave y con una ligera firmeza.","item.phoshrimp.name":"Pho de camarón","item.phoshrimp.desc":"Camarones grandes pochados, ligeros y frescos.","item.phomeatballs.name":"Pho de albóndigas","item.phomeatballs.desc":"Albóndigas vietnamitas con tendón.","item.phobourdain.name":"Pho Anthony Bourdain","item.phobourdain.desc":"Cebollín, cebolla morada y ajo picado dorados en el wok, con filet mignon y fideos planos. Con un sabor ahumado e intenso.","item.drynoodle.name":"Fideos secos con panceta de res","item.drynoodle.desc":"Panceta de res salteada en salsa de zacate limón, servida sobre una mezcla de hojas verdes frescas, verduras y fideos planos. Con cacahuates tostados, chalotes fritos y hierbas frescas. El platillo se sirve seco, sin caldo.","addon.shaken.name":"Pide tu pho al estilo shaken","addon.shaken.desc":"Ajo, cebollín y cebolla morada dorados en el wok con aceite de tuétano. Aportan un profundo sabor ahumado al estilo del norte.","addon.sousvide.name":"Agrega un huevo sous vide","addon.sousvide.desc":"Huevo pochado a fueg  tại quán.","allergen.milk":"Bơ sữa","allergen.egg":"Trứng","allergen.fish":"Cá","allergen.shellfish":"Hải sản có vỏ","allergen.peanut":"Đậu phộng","allergen.treenut":"Hạt cây","allergen.gluten":"Gluten","allergen.soy":"Đậu nành","allergen.sesame":"Mè","sec.appetizers.title":"Món khai vị","sec.pho.title":"Phở","sec.pho.intro":"Bánh phở sợi mảnh chan nước dùng hầm xương bò, rắc hành tây trắng, hành lá và ngò. Thêm bánh phở không giới hạn, miễn phí khi dùng phở tại quán.","sec.pho.brothNote":"Tất cả các tô phở, kể cả phở rau củ và đậu hũ, đều nấu bằng nước dùng hầm xương bò.","sec.plates.title":"Cơm dĩa và mì","sec.extras.title":"Món thêm","sec.kids.title":"Món cho bé","sec.drinks.title":"Thức uống","item.bao.name":"Bánh bao chiên vàng","item.bao.tagline":"Bánh bao nhân thịt heo chiên","item.bao.desc":"Thịt vai heo xay, hành tây xào vàng, nấm và trứng luộc chín kỹ, bọc trong vỏ bánh nhà làm rồi chiên giòn.","item.bao.price.three":"Ba cái","item.bao.price.one":"Một cái","item.springroll.name":"Gỏi cuốn tôm","item.springroll.tagline":"Tôm","item.springroll.desc":"Giá tươi, húng lủi, xà lách và bún cuốn trong bánh tráng. Dùng kèm tương đậu phộng.","item.eggrolls.name":"Chả giò","item.eggrolls.desc":"Thịt heo xay, nấm, hành, cà rốt và miến, chiên giòn. Dùng kèm cà rốt ngâm chua, bún, xà lách và nước mắm chua ngọt.","item.eggrolls.price.three":"Ba cuốn","item.eggrolls.price.extra":"Thêm một cuốn (tổng cộng bốn cuốn)","item.shakenfries.name":"Khoai tây chiên bò lúc lắc","item.shakenfries.desc":"Khoai tây chiên giòn cỡ lớn phủ bò ba chỉ lúc lắc, tỏi, hành tây xào vàng, phô mai cheddar đậm vị và sốt tartar cay.","item.trufflefries.name":"Khoai tây chiên nấm truffle","item.trufflefries.desc":"Khoai tây chiên giòn cỡ lớn trộn rau thơm tươi, phô mai parmesan và dầu truffle Ý. Dùng kèm sốt aioli aji verde cay, tương cà và sốt mayo cay.","item.parmfries.name":"Khoai tây chiên phô mai parmesan","item.parmfries.desc":"Khoai tây chiên giòn cỡ lớn trộn rau thơm tươi và tỏi, phủ phô mai parmesan. Dùng kèm sốt aioli aji verde cay, tương cà và sốt mayo cay.","item.wings.name":"Cánh gà chiên","item.wings.desc":"Cánh gà chiên giòn, chọn vị tỏi hoặc phô mai parmesan.","item.wings.note":"Cánh gà phô mai parmesan có chứa bơ sữa.","item.wings.price.garlic":"Tỏi","item.wings.price.parmesan":"Phô mai parmesan","item.nuggets.name":"Gà viên chiên kèm khoai tây chiên","item.nuggets.desc":"Gà viên chiên giòn kèm khoai tây chiên giòn cỡ lớn, tương cà và sốt mayo cay.","item.phoshortrib.name":"Phở sườn bò không xương","item.phoshortrib.tagline":"Không xương","item.phoshortrib.desc":"Sườn bò không xương thái mỏng, đậm đà và mềm tan trong miệng.","item.phoribbones.name":"Phở sườn bò có xương","item.phoribbones.tagline":"Hai khúc sườn","item.phoribbones.desc":"Sườn bò hầm bốn tiếng, thịt mềm rục, dễ róc xương, hương vị đậm đà.","item.phobeefbelly.name":"Phở bò ba chỉ","item.phobeefbelly.desc":"Bò ba chỉ có vân mỡ, thái lát mỏng.","item.phobeefbelly.note":"Ưu đãi bữa trưa từ thứ Hai đến thứ Sáu: $11.99, chỉ dùng tại quán, từ 10 giờ sáng đến 4 giờ chiều.","item.phofilet.name":"Phở filet mignon","item.phofilet.desc":"Thăn bò filet mignon nạc, mềm và đậm vị.","item.phocombo.name":"Phở đặc biệt","item.phocombo.desc":"Gồm bò ba chỉ, gân, nạm, bò viên và một khúc sườn.","item.phocombo.note":"Không đổi loại thịt.","item.phoveggie.name":"Phở rau củ và đậu hũ","item.phoveggie.desc":"Đậu hũ, bông cải xanh, cà rốt và cải thảo trong nước dùng bò đậm đà.","item.phoveggie.note":"Nấu bằng nước dùng bò nên tô này không phải món chay.","item.phobrisket.name":"Phở nạm","item.phobrisket.desc":"Nạm bò hầm bốn tiếng, mềm mà vẫn dai nhẹ.","item.phoshrimp.name":"Phở tôm","item.phoshrimp.desc":"Tôm lớn luộc chín, thanh nhẹ và tươi ngon.","item.phomeatballs.name":"Phở bò viên","item.phomeatballs.desc":"Bò viên gân kiểu Việt Nam.","item.phobourdain.name":"Phở Anthony Bourdain","item.phobourdain.desc":"Hành lá, hành tây tím và tỏi băm xào lửa lớn cùng filet mignon và bánh phở sợi dẹp. Thơm mùi khói, đậm đà hương vị.","item.drynoodle.name":"Phở khô bò ba chỉ xào sả","item.drynoodle.desc":"Bò ba chỉ xào sốt sả, dọn trên hỗn hợp rau non tươi, rau củ và bánh phở sợi dẹp. Rắc đậu phộng rang, hành phi và rau thơm tươi. Dùng khô, không có nước dùng.","addon.shaken.name":"Phở kiểu lúc lắc","addon.shaken.desc":"Tỏi, hành lá và hành tây tím xào lửa lớn trong dầu tủy xương. Tạo hương thơm khói đậm đà, mang phong vị miền Bắc rất riêng.","addon.sousvide.name":"Thêm trứng sous vide","addon.sousvide.desc":"Trứng chần ở nhiệt độ thấp, giúp nước dùng thêm béo ngậy.","addon.mala.name":"Thêm vị tê cay mala","addon.mala.desc":"Dầu ớt mala nhà làm.","addon.spicy.name":"Phở cay","addon.spicy.desc":"Sa tế ớt sả nhà làm.","item.lomo.name":"Lomo Saltado","item.lomo.desc":"Chọn filet mignon, tôm hoặc đậu hũ, dùng cùng khoai tây chiên cắt dày, hành tây tím cháy cạnh có vị ngọt, cà chua, sốt xì dầu pha rượu vang trắng và cơm trắng. Dùng kèm sốt aioli aji verde cay nhà làm.","item.lomo.note":"Dĩa tôm có chứa hải sản có vỏ. Sốt aioli thường làm từ trứng, nên hãy hỏi nhân viên phục vụ về dĩa đậu hũ thuần chay.","item.lomo.price.filet":"Filet mignon","item.lomo.price.shrimp":"Tôm","item.lomo.price.tofu":"Đậu hũ thuần chay","addon.lomofriedegg.name":"Trứng ốp la","addon.lomosoftegg.name":"Trứng luộc lòng đào","item.cajun.name":"Mì xào bơ tỏi Cajun","item.cajun.desc":"Sợi mì làm từ bột lúa mì, trộn với bơ và sốt tỏi Cajun, rắc hành lá tươi. Dùng kèm sốt aioli aji verde cay nhà làm.","item.cajun.note":"Dĩa tôm và xúc xích có chứa hải sản có vỏ.","item.cajun.price.shrimpsausage":"Tôm và xúc xích","item.cajun.price.filet":"Filet mignon","item.friedrice.name":"Cơm chiên","item.friedrice.desc":"Cơm chiên với trứng chiên tơi, hành lá và phần thịt, tôm hoặc đậu hũ tùy chọn. Dùng kèm sốt aioli aji verde cay nhà làm để riêng.","item.friedrice.note":"Dĩa tôm có chứa hải sản có vỏ. Các dĩa đậu hũ có chứa đậu nành. Cánh gà tẩm bột lúa mì.","item.friedrice.price.shrimp":"Tôm","item.friedrice.price.s ,"ui.lunchEyebrow":"시즌 한정 특가","ui.lunchTitle":"우삼겹 쌀국수 런치 스페셜","ui.lunchWhen":"월~금, 오전 10시~오후 4시","ui.lunchTerms":"매장 식사 전용이며 공휴일은 제외됩니다. SUP Noodle Bar 전 지점에서 이용 가능합니다. 추가 토핑과 사이드는 별도 요금이 부과됩니다. 기간 한정 행사입니다.","ui.lunchRegular":"정가","ui.unlimitedRefill":"면 무제한 리필","ui.kimchiEyebrow":"지금 주문 가능","ui.kimchiTitle":"김치볶음밥","ui.kimchiSub":"스팸, 순두부 또는 안심 중 선택","ui.seeItem":"메뉴 보기","ui.dineInOnly":"매장 식사 전용","ui.locations":"매장 안내","ui.buenaPark":"Buena Park","ui.irvine":"Irvine","ui.allergyTitle":"알레르기 및 식이 제한 안내","ui.allergyNotice":"식이 제한이나 식품 알레르기가 있으시면 직원에게 알려 주시기 바랍니다. 심한 식품 알레르기나 민감 반응이 있는 고객께서는 SUP에서 식사하실 때 각별히 주의해 주시기 바랍니다. 저희는 식품 알레르기에 대응하고 고객의 안전을 지키기 위해 최선을 다하고 있지만, 교차 오염의 가능성은 언제나 존재하며 알레르기 유발 성분이 전혀 없는 환경을 보장할 수는 없습니다. 궁금한 점이 있으시면 직원에게 문의하시기 바랍니다.","ui.rawTitle":"덜 익힌 음식 안내","ui.rawNotice":"날것이거나 덜 익힌 달걀, 육류, 가금류, 해산물 또는 갑각류·조개류를 섭취하면 식중독 위험이 높아질 수 있으며, 특히 특정 질환이 있는 분은 위험이 더 높을 수 있습니다. 반숙 달걀, 수란, 서니사이드업 또는 오버이지 달걀 프라이를 사용한 메뉴와 레어 또는 미디엄 레어 스테이크는 덜 익힌 상태일 수 있습니다. 우려되는 점이 있으시면 직원에게 알려 주시기 바랍니다.","ui.phoRefill":"매장에서 쌀국수를 드시면 면을 무료로 무제한 리필해 드립니다.","allergen.milk":"유제품","allergen.egg":"달걀","allergen.fish":"생선","allergen.shellfish":"갑각류·조개류","allergen.peanut":"땅콩","allergen.treenut":"견과류","allergen.gluten":"글루텐","allergen.soy":"대두","allergen.sesame":"참깨","sec.appetizers.title":"애피타이저","sec.pho.title":"쌀국수","sec.pho.intro":"소뼈 육수에 가는 쌀국수 면을 넣고 흰 양파, 파, 고수를 얹어 드립니다. 매장에서 쌀국수를 드시면 면을 무료로 무제한 리필해 드립니다.","sec.pho.brothNote":"채소·두부 쌀국수를 포함한 모든 쌀국수는 소뼈 육수로 만듭니다.","sec.plates.title":"밥과 면 요리","sec.extras.title":"추가 메뉴","sec.kids.title":"어린이 메뉴","sec.drinks.title":"음료","item.bao.name":"골든 바오","item.bao.tagline":"돼지고기 튀김만두","item.bao.desc":"다진 돼지 어깨살, 캐러멜라이즈한 양파, 버섯, 완숙으로 삶은 달걀을 직접 만든 반죽으로 감싸 바삭하게 튀겼습니다.","item.bao.price.three":"바오 3개","item.bao.price.one":"바오 1개","item.springroll.name":"새우 월남쌈","item.springroll.tagline":"새우","item.springroll.desc":"신선한 숙주, 민트, 상추, 버미셀리를 라이스페이퍼로 감쌌습니다. 땅콩 소스와 함께 드립니다.","item.eggrolls.name":"짜조","item.eggrolls.desc":"다진 돼지고기, 버섯, 양파, 당근, 당면을 넣어 바삭하게 튀겼습니다. 당근 피클, 버미셀리, 상추, 새콤달콤한 피시 소스와 함께 드립니다.","item.eggrolls.price.three":"짜조 3개","item.eggrolls.price.extra":"1개 추가 (총 4개)","item.shakenfries.name":"셰이큰 하우스 감자튀김","item.shakenfries.desc":"굵고 바삭한 감자튀김 위에 볶은 우삼겹, 마늘, 캐러멜라이즈한 양파, 샤프 체다 치즈, 매콤한 타르타르 소스를 얹었습니다.","item.trufflefries.name":"트러플 감자튀김","item.trufflefries.desc":"굵고 바삭한 감자튀김에 신선한 허브, 파르메산 치즈, 이탈리아산 트러플 오일을 버무렸습니다. 매콤한 aji verde 아이올리, 케첩, 스파이시 마요와 함께 드립니다.","item.parmfries.name":"파르메산 감자튀김","item.parmfries.desc":"굵고 바삭한 감자튀김에 신선한 허브와 마늘을 버무리고 파르메산 치즈를 얹었습니다. 매콤한 aji verde 아이올리, 케첩, 스파이시 마요와 함께 드립니다.","item.wings.name":"치킨 윙","item.wings.desc":"바삭하게 튀긴 치킨 윙, 갈릭 또는 파르메산 중 선택.","item.wings.note":"파르메산 윙에는 유제품이 포함되어 있습니다.","item.wings.price.garlic":"갈릭","item.wings.price.parmesan":"파르메산","item.nuggets.name":"치킨 너겟 바스켓","item.nuggets.desc":"바삭한 너겟과 굵은 감자튀김, 케첩, 스파이시 마요.","item.phoshortrib.name":"갈비 쌀국수","item.phoshortrib.tagline":"뼈 없는 갈비살","item.phoshortrib.desc":"얇게 썬 뼈 없는 갈비살로, 풍미가 깊고 입에서 살살 녹습니다.","item.phoribbones.name":"뼈갈비 쌀국수","item.phoribbones.tagline":"갈비 2대","item.phoribbones.desc":"4시간 동안 푹 삶아 뼈에서 살이 술술 떨어지는 소갈비, 깊고 진한 맛이 일품입니다.","item.phobeefbelly.name":"우삼겹 쌀국수","item.phobeefbelly.desc":"얇게 썬 마블링 좋은 우삼겹.","item.phobeefbelly.note":"평일 런치 스페셜: $11.99. 오전 10시부터 오후 4시까지 매장 식사 시에만 적용됩니다.","item.phofilet.name":"안심 쌀국수","item.phofilet.desc":"기름기 적고 부드러우며 풍미 가득한 안심.","item.phocombo.name":"모둠 쌀국수","item.phocombo.desc":"우삼겹, 힘줄, 양지, 미트볼, 갈비 1대를 함께 담았습니다.","item.phocombo.note":"고기 종류 변경은 불가합니다.","item.phoveggie.name":"채소·두부 쌀국수","item.phoveggie.desc":"진한 소고기 육수에 두부, 브로콜리, 당근, 배추를 넣었습니다.","item.phoveggie.note":"소고기 육수로 만들기 때문에 채식 메뉴가 아닙니다.","item.phobrisket.name":"양지 쌀국수","item.phobrisket.desc":"4시간 동안 푹 삶아 부드러우면서도 살짝 씹는 맛이 있는 양지.","item.phoshrimp.name":"새우 쌀국수","item.phoshrimp.desc":"큼직한 새우를 데쳐 담백하고 산뜻한 맛을 냈습니다.","item.phomeatballs.name":"미트볼 쌀국수","item.phomeatballs.desc":"베트남식 힘줄 미트볼.","item.phobourdain.name":"Anthony Bourdain 쌀국수","item.phobourdain.desc":"웍에 센 불로 볶은 파, 적양파, 다진 마늘에 안심과 넓적한 면을 곁들였습니다. 불향 가득하고 풍미가 진합니다.","item.drynoodle.name":"우삼겹 비빔 쌀국수","item.drynoodle.desc":"레몬그라스 소스에 볶은 우삼겹을 신선한 어린잎 채소와 각종 채소, 넓적한 면 위에 올렸습니다. 볶은 땅콩, 튀긴 샬롯, 신선한 허브를 얹어 드립니다. 국물 없이 제공합니다.","addon.shaken.name":"셰이큰 스타일로 변경","addon.shaken.desc":"마늘, 파, 적양파를 소 골수 기름에 센 불로 볶아 넣습니다. 깊은 불향이 더해져 북부식 특유의 풍미를 냅니다.","addon.sousvide.name":"수비드 달걀 추가","addon.sousvide.desc":"저온으로 천천히 익힌 달걀이 육수에 부드럽고 진한 맛을 더합니다.","addon.mala.name":"얼얼한 마라맛 추가","addon.mala.desc":"직접 만든 마라 고추기름.","addon.spicy.name":"쌀국수 매운맛 추가","addon.spicy.desc":"레몬그라스를 넣어 직접 만든 고추 페이스트.","item.lomo.name":"로모 살타도","item.lomo.desc":"선택하신 재료에 두툼한 감자튀김, 불에 구운 달콤한 적양파, 토마토, 화이트 와인 간장 소스와 흰쌀밥을 곁들였습니다. 직접 만든 매콤한 aji verde 아이올리와 함께 드립니다.","item.lomo.note":"새우 메뉴에는 갑각류·조개류가 포함되어 있습니다. 아이올리는 보통 달걀로 만들므로 비건 두부 메뉴에 대해서는 직원에게 확인하시기 바랍니다.","item.lomo.price.filet":"안심","item.lomo.price.shrimp":"새우","item.lomo.price.tofu":"비건 두부","addon.lomofriedegg.name":"달걀 프라이","addon.lomosoftegg.name":"반숙 달걀","item.cajun.name":"케이준 갈릭 누들","item.cajun.desc":"밀로 만든 면을 버터와 케이준 갈릭 소스에 버무리고 신선한 파를 올렸습니다. 직접 만든 매콤한 aji verde 아이올리와 함께 드립니다.","item.cajun.note":"새우·소시지 메뉴에는 갑각류·조개류가 포함되어 있습니다.","item.cajun.price.shrimpsausage":"새우와 소시지","item.cajun.price.filet":"안심","item.friedrice.name":"볶음밥","item.friedrice.desc":"선택하신 재료와 스크램블 에그, 파를 넣은 볶음밥입니다. 직접 만든 매콤한 aji verde 아이올리를 따로 곁들여 드립니다.","item.friedrice.note":"새우 메뉴에는 갑각류·조개류가 포함되어 있습니다. 두부 메뉴에는 대두가 포함되어 있습니다. 치킨 윙은 밀가루 튀김옷을 입혔습니다.","item.friedrice.price.shrimp":"새우","item.friedrice.price.spam":"스팸","item.friedrice.price.wings":"치킨 윙","item.friedrice.price.filet":"안심","item.friedrice.price.softtofu":"순두부","item.friedrice.price.friedtofu":"튀긴 두부","item.kimchi.name":"김치볶음밥","item.kimchi.desc":"김치, 스크램블 에그, 파를 넣은 특제 볶음밥입니다. 직접 만든 매콤한 aji verde 아이올리를 따로 곁들여 드립니다.","item.kimchi.note":"김치는 보통 피시 소스와 새우젓을 넣어 발효시킵니다. 순두부 메뉴에는 대두가 포함되어 있습니다.","item.kimchi.price.spam":"스팸","item.kimchi.price.softtofu":"순두부","item.kimchi.price.filet":"안심","item.sidenoodles.name":"면 추가","item.sidenoodles.desc":"매장에서 쌀국수를 주문하시면 면을 무제한으로 리필해 드립니다.", "item.springroll.desc":"新鲜豆芽、薄荷、生菜和米粉以米纸包裹，配花生酱。","item.eggrolls.name":"越式炸春卷","item.eggrolls.desc":"猪肉末、蘑菇、洋葱、胡萝卜和粉丝，炸至金黄酥脆。配腌胡萝卜、米粉、生菜和酸甜鱼露。","item.eggrolls.price.three":"三条","item.eggrolls.price.extra":"加一条（共四条）","item.shakenfries.name":"招牌炒牛五花薯条","item.shakenfries.desc":"粗切酥脆薯条，铺上越式爆炒牛五花、蒜蓉、焦糖洋葱、浓味切达芝士和香辣塔塔酱。","item.trufflefries.name":"松露薯条","item.trufflefries.desc":"粗切酥脆薯条拌以新鲜香草、帕玛森芝士和意大利松露油。配香辣 aji verde 蒜香酱、番茄酱和辣味蛋黄酱。","item.parmfries.name":"帕玛森芝士薯条","item.parmfries.desc":"粗切酥脆薯条拌以新鲜香草和蒜蓉，撒上帕玛森芝士。配香辣 aji verde 蒜香酱、番茄酱和辣味蛋黄酱。","item.wings.name":"炸鸡翅","item.wings.desc":"酥炸鸡翅，可选蒜香或帕玛森芝士口味。","item.wings.note":"帕玛森芝士鸡翅含有乳制品。","item.wings.price.garlic":"蒜香","item.wings.price.parmesan":"帕玛森芝士","item.nuggets.name":"炸鸡块拼盘","item.nuggets.desc":"酥脆鸡块配粗切酥脆薯条、番茄酱和辣味蛋黄酱。","item.phoshortrib.name":"无骨牛小排河粉","item.phoshortrib.tagline":"无骨","item.phoshortrib.desc":"薄切无骨牛小排，味道浓郁，入口即化。","item.phoribbones.name":"带骨牛肋排河粉","item.phoribbones.tagline":"两根肋排","item.phoribbones.desc":"慢炖四小时的牛肋排，软烂脱骨，味道浓郁醇厚。","item.phobeefbelly.name":"牛五花河粉","item.phobeefbelly.desc":"薄切雪花牛五花。","item.phobeefbelly.note":"工作日午市特惠：$11.99，仅限堂食，上午10点至下午4点。","item.phofilet.name":"菲力牛柳河粉","item.phofilet.desc":"精瘦菲力牛柳，鲜嫩多汁。","item.phocombo.name":"什锦牛肉河粉","item.phocombo.desc":"牛五花、牛筋、牛腩、牛肉丸和一根牛肋排的组合。","item.phocombo.note":"肉类不可更换。","item.phoveggie.name":"蔬菜豆腐河粉","item.phoveggie.desc":"豆腐、西兰花、胡萝卜和大白菜，配浓郁牛骨汤。","item.phoveggie.note":"以牛骨汤制作，因此本品并非素食。","item.phobrisket.name":"牛腩河粉","item.phobrisket.desc":"慢炖四小时的牛腩，软嫩中带点嚼劲。","item.phoshrimp.name":"鲜虾河粉","item.phoshrimp.desc":"大只白灼鲜虾，清爽鲜甜。","item.phomeatballs.name":"牛肉丸河粉","item.phomeatballs.desc":"越式牛筋丸。","item.phobourdain.name":"Anthony Bourdain 河粉","item.phobourdain.desc":"葱段、红洋葱和蒜蓉经大火爆香，配菲力牛柳和宽河粉。镬气十足，滋味浓郁。","item.drynoodle.name":"牛五花干捞河粉","item.drynoodle.desc":"香茅酱炒牛五花，铺在新鲜混合生菜、蔬菜和宽河粉上。撒上烤花生、炸红葱头和新鲜香草。干拌，不带汤。","addon.shaken.name":"河粉加爆香配料","addon.shaken.desc":"以牛骨髓油爆香蒜蓉、葱段和红洋葱，增添烟香层次，呈现独特的北越风味。","addon.sousvide.name":"加低温慢煮蛋","addon.sousvide.desc":"低温慢煮蛋，为汤底增添绵滑浓香 lergyNotice":"Ipaalam sa tagapagsilbi kung mayroon kang mga limitasyon sa pagkain o alerhiya sa pagkain. Mahigpit naming ipinapayo sa mga bisitang may malubhang alerhiya o sensitibidad sa pagkain na mag-ingat kapag kumakain sa SUP. Ginagawa namin ang lahat ng makakaya upang matugunan ang mga pangangailangan kaugnay ng alerhiya sa pagkain at mapanatiling ligtas ang aming mga bisita, ngunit laging posible ang paglipat ng mga allergen sa ibang pagkain at hindi namin magagarantiyang walang allergen sa aming lugar. Kung may mga tanong ka, magtanong sa tagapagsilbi.","ui.rawTitle":"Paunawa sa pagkaing hindi lubos na luto","ui.rawNotice":"Ang pagkain ng hilaw o hindi lubos na lutong itlog, karne, karne ng mga ibon, pagkaing-dagat o shellfish ay maaaring magpataas ng panganib ng sakit mula sa pagkain, lalo na sa mga taong may ilang kondisyong medikal. Maaaring hindi lubos na luto ang mga pagkaing may itlog na nilaga na malambot pa ang pula, itlog na niluto sa tubig nang walang balat, itlog na pinirito sa isang panig lamang, o itlog na bahagyang pinirito sa magkabilang panig na malabnaw pa ang pula, pati na ang mga steak na bahagya lang ang pagkaluto (rare o medium-rare). Ipaalam sa tagapagsilbi kung mayroon kang mga alalahanin.","ui.phoRefill":"Libreng dagdag na pansit na walang limitasyon kapag dito kakain ng pho.","allergen.milk":"Dairy","allergen.egg":"Itlog","allergen.fish":"Isda","allergen.shellfish":"Shellfish","allergen.peanut":"Mani","allergen.treenut":"Mga nuwes mula sa puno","allergen.gluten":"Gluten","allergen.soy":"Soya","allergen.sesame":"Linga","sec.appetizers.title":"Mga pampagana","sec.pho.title":"Pho","sec.pho.intro":"Manipis na pansit na gawa sa bigas sa sabaw ng buto ng baka, na may puting sibuyas, murang dahon ng sibuyas at wansoy. Libreng dagdag na pansit na walang limitasyon kapag dito kakain ng pho.","sec.pho.brothNote":"Lahat ng pho, pati ang may gulay at tokwa, ay gawa sa sabaw ng buto ng baka.","sec.plates.title":"Mga kanin at pansit","sec.extras.title":"Mga dagdag","sec.kids.title":"Para sa mga bata","sec.drinks.title":"Mga inumin","item.bao.name":"Gintong bao","item.bao.tagline":"Pritong bao na may baboy","item.bao.desc":"Giniling na balikat ng baboy, sibuyas na niluto hanggang maging karamelo, kabute at nilagang itlog na matigas na ang pula, binalot sa masa na gawa namin at pinirito hanggang lumutong.","item.bao.price.three":"Tatlong bao","item.bao.price.one":"Isang bao","item.springroll.name":"Sariwang lumpia","item.springroll.tagline":"Hipon","item.springroll.desc":"Sariwang toge, mint, letsugas at bihon na binalot sa balat na gawa sa bigas. May kasamang sarsa ng mani.","item.eggrolls.name":"Pritong lumpia","item.eggrolls.desc":"Giniling na baboy, kabute, sibuyas, karot at sotanghon, pinirito sa maraming mantika hanggang lumutong. May kasamang inatsarang karot, bihon, letsugas at matamis-asim na sarsang patis.","item.eggrolls.price.three":"Tatlong lumpia","item.eggrolls.price.extra":"Dagdag na isang lumpia (apat na lumpia sa kabuuan)","item.shakenfries.name":"Espesyal na patatas na may ginisang baka","item.shakenfries.desc":"Malalaki at malutong na pritong patatas na may ginisang liempo ng baka, bawang, sibuyas na niluto hanggang maging karamelo, cheddar na matapang ang lasa at maanghang na tartar sauce.","item.trufflefries.name":"Pritong patatas na may truffle","item.trufflefries.desc":"Malalaki at malutong na pritong patatas na hinaluan ng sariwang mga halamang pampalasa, kesong parmesan at langis ng truffle mula sa Italya. May kasamang maanghang na aji verde aioli, ketsap at maanghang na mayonesa.","item.parmfries.name":"Pritong patatas na may parmesan","item.parmfries.desc":"Malalaki at malutong na pritong patatas na hinaluan ng sariwang mga halamang pampalasa at bawang, na may kesong parmesan sa ibabaw. May kasamang maanghang na aji verde aioli, ketsap at maanghang na mayonesa.","item.wings.name":"Pakpak ng manok","item.wings.desc":"Malutong na pritong pakpak ng manok, may pagpipiliang bawang o parmesan.","item.wings.note":"May dairy ang pakpak na may parmesan.","item.wings.price.garlic":"Bawang","item.wings.price.parmesan":"Parmesan","item.nuggets.name":"Basket ng nuggets ng manok","item.nuggets.desc":"Malutong na nuggets na may malalaki at malutong na pritong patatas, ketsap at maanghang na mayonesa.","item.phoshortrib.name":"Pho na may short rib","item.phoshortrib.tagline":"Walang buto","item.phoshortrib.desc":"Manipis na hiwa ng short rib na walang buto, malasa at sa lambot ay natutunaw sa bibig.","item.phoribbones.name":"Pho na may tadyang na may buto","item.phoribbones.tagline":"Dalawang buto","item.phoribbones.desc":"Tadyang ng baka na marahang niluto sa kaunting likido nang apat na oras, malinamnam at punô ng lasa, na may lamáng madaling humiwalay sa buto.","item.phobeefbelly.name":"Pho na may liempo ng baka","item.phobeefbelly.desc":"Manipis na hiwa ng liempo ng baka na may mga guhit ng taba.","item.phobeefbelly.note":"Espesyal sa tanghalian tuwing Lunes hanggang Biyernes: $11.99, para lang sa pagkain dito, 10 n.u. hanggang 4 n.h.","item.phofilet.name":"Pho na may filet mignon","item.phofilet.desc":"Filet mignon na kaunti ang taba, malambot at malasa.","item.phocombo.name":"Pho na may iba't ibang sangkap","item.phocombo.desc":"Halo ng liempo ng baka, litid, pecho, bola-bola at isang tadyang na may buto.","item.phocombo.note":"Walang pagpapalit ng karne.","item.phoveggie.name":"Pho na may gulay at tokwa","item.phoveggie.desc":"Tokwa, brokoli, karot at petsay Baguio sa malinamnam na sabaw ng baka.","item.phoveggie.note":"Gawa sa sabaw ng baka, kaya hindi ito pagkaing para sa mga vegetarian.","item.phobrisket.name":"Pho na may pecho ng baka","item.phobrisket.desc":"Pecho ng baka na marahang niluto sa kaunting likido nang apat na oras, malambot ngunit bahagyang may kunat.","item.phoshrimp.name":"Pho na may hipon","item.phoshrimp.desc":"Malalaking hipon na marahang niluto sa tubig, magaan at sariwa ang lasa.","item.phomeatballs.name":"Pho na may bola-bola"   const dt = (s1[0] - s0[0]) / 1000;
  return { vx: (s1[1] - s0[1]) / dt, vy: (s1[2] - s0[2]) / dt };
}
LB.track.addEventListener("pointerdown", e => {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  if (LB.pointers.size >= 2 && !LB.pointers.has(e.pointerId)) return;
  try { LB.track.setPointerCapture(e.pointerId); } catch (err) {}
  LB.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const now = performance.now();
  if (LB.pointers.size === 1) LB.gest = { x0: e.clientX, y0: e.clientY, t0: now, tx0: LB.tx, ty0: LB.ty, mode: null, samples: [[now, e.clientX, e.clientY]] };
  else {
    const g = LB.gest;
    if (g && g.mode === "drag") lbSpringBack();
    lbCancelTap(); lbStartPinch(now);
  }
});
LB.track.addEventListener("pointermove", e => {
  if (!LB.pointers.has(e.pointerId) || !LB.gest) return;
  LB.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const g = LB.gest, now = performance.now();
  if (g.mode === "done") return;
  if (g.mode === "pinch") {
    if (LB.pointers.size < 2) return;
    const [a, b] = [...LB.pointers.values()]; const m = mid(a, b);
    const s = clamp(g.s0 * dist(a, b) / g.d0, 1, 4), bd = lbBounds(s);
    const cx = (g.m0.x - vw() / 2 - g.tx0) / g.s0, cy = (g.m0.y - vh() / 2 - g.ty0) / g.s0;
    lbSetZoom(LB.index, s, clamp(m.x - vw() / 2 - cx * s, -bd.x, bd.x), clamp(m.y - vh() / 2 - cy * s, -bd.y, bd.y), false);
    return;
  }
  if (LB.pointers.size !== 1) return;
  const dx = e.clientX - g.x0, dy = e.clientY - g.y0;
  g.samples.push([now, e.clientX, e.clientY]); if (g.samples.length > 8) g.samples.shift();
  if (LB.s > 1.01) {
    if (!g.mode) { if (Math.hypot(dx, dy) < 6) return; g.mode = "pan"; lbCancelTap(); }
    const bd = lbBounds(LB.s); lbSetZoom(LB.index, LB.s, clamp(g.tx0 + dx, -bd.x, bd.x), clamp(g.ty0 + dy, -bd.y, bd.y), false); return;
  }
  if (!g.mode) { if (Math.hypot(dx, dy) < 14) return; g.mode = "drag"; lbCancelTap(); }
  if (g.mode === "drag") lbDrag(dx, dy);
});
function lbPointerEnd(e) {
  if (!LB.pointers.has(e.pointerId)) return;
  LB.pointers.delete(e.pointerId);
  if (e.type === "pointercancel") lbCancelTap();
  const g = LB.gest; if (!g) return;
  const now = performance.now();
  if (g.mode === "pinch") {
    if (LB.pointers.size >= 2) { lbStartPinch(now); return; }
    if (LB.s < 1.01) lbSetZoom(LB.index, 1, 0, 0, true);
    if (LB.pointers.size === 1) { const p = [...LB.pointers.values()][0]; LB.gest = { x0: p.x, y0: p.y, t0: now, tx0: LB.tx, ty0: LB.ty, mode: LB.s > 1.01 ? "pan" : "done", samples: [] }; }
    else LB.gest = null;
    return;
  }
  LB.gest = null;
  if (g.mode === "pan" || g.mode === "done") return;
  const dx = e.clientX - g.x0, dy = e.clientY - g.y0;
  const v = lbVelocity(g, now, e.clientX, e.clientY);
  if (g.mode === "drag") {
    const d = Math.hypot(dx, dy), flick = Math.hypot(dx + v.vx * .25, dy + v.vy * .25);
    if (d > 60 || (e.type === "pointerup" && flick > 300)) { LB.exit = { fling: { dx, dy } }; closeDialog(LB.dlg); }
    else lbSpringBack();
    return;
  }
  if (e.type === "pointerup" && Math.hypot(dx, dy) < 10 && now - g.t0 < 350) lbTap(e.clientX, e.clientY);
}
LB.track.addEventListener("pointerup", lbPointerEnd);
LB.track.addEventListener("pointercancel", lbPointerEnd);
$("lbClose").addEventListener("click", () => closeDialog(LB.dlg));
$("lbPrev").addEventListener("click", () => lbGoto(LB.index - 1, true));
$("lbNext").addEventListener("click", () => lbGoto(LB.index + 1, true));
LB.dlg.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") { e.preventDefault(); lbGoto(LB.index + 1, true); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); lbGoto(LB.index - 1, true); }
});
window.addEventListener("resize", () => {
  if (!LB.dlg.open) return;
  lbCancelGesture();
  [...LB.zooms, LB.bg, LB.chrome].forEach(el => el.getAnimations().forEach(a => a.finish()));
  lbLayout(); lbSetZoom(LB.index, 1, 0, 0, false); lbPlaceTrack(false);
});
$("main").addEventListener("click", e => {
  const b = e.target.closest("[data-photo]"); if (!b) return;
  if (navigator.vibrate) navigator.vibrate(10);
  lbOpen(+b.dataset.photo, b);
});

if ("ResizeObserver" in window) new ResizeObserver(syncBarHeight).observe($("bar"));
state.lang = pickLang();
(load("sup-avoid") || "").split(",").filter(a => ORDER.includes(a)).forEach(a => state.avoid.add(a));
/* A menu always opens at the top. A leftover fragment from a tapped special, or a scroll position the browser
   restores, would otherwise drop a diner into the middle of the menu. */
if ("scrollRestoration" in history) history.scrollRestoration = "manual";
if (location.hash) { const u = new URL(location.href); u.hash = ""; history.replaceState(history.state, "", u); }
render();
window.scrollTo(0, 0);
addEventListener("pageshow", e => { if (e.persisted) window.scrollTo(0, 0); });
</script>
</body>
