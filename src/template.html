<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<title>SUP Noodle Bar Menu</title>
<link rel="icon" href="__ICON__">
<link rel="apple-touch-icon" href="__ICON__">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Noto+Sans:wght@400;600;700&family=Noto+Sans+KR:wght@400;700&family=Noto+Sans+SC:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
  :root {
    --red: #E5342B; --red-deep: #B4231C;
    --ink: #1B1917; --body: #4A4542; --muted: #625B56;
    --ground: #F6F2ED; --surface: #FFFFFF; --line: #D8D0C8; --line-soft: #E9E3DC; --control: #837A74;
    --flag-bg: #FCEAE8; --amber: #9A5A0B; --amber-bg: #FFF3DE; --amber-line: #F0D3A3;
    --display: "Barlow Condensed", "Noto Sans", "Arial Narrow", Arial, sans-serif;
    --text: "Noto Sans", -apple-system, "Helvetica Neue", Arial, sans-serif;
    --maxw: 720px; --bar-h: 52px; --thumb: 84px; --ease: cubic-bezier(.2, .8, .2, 1);
  }
  html[lang="ko"] { --display: "Noto Sans", "Noto Sans KR", sans-serif; --text: "Noto Sans", "Noto Sans KR", sans-serif; }
  html[lang="zh-Hans"] { --display: "Noto Sans", "Noto Sans SC", sans-serif; --text: "Noto Sans", "Noto Sans SC", sans-serif; }
  html[lang="zh-Hant"] { --display: "Noto Sans", "Noto Sans TC", sans-serif; --text: "Noto Sans", "Noto Sans TC", sans-serif; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; background: var(--ground); }
  html.modal { overflow: hidden; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; } }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--text); font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
  html[lang="ko"] body { word-break: keep-all; }
  a { color: var(--red-deep); }
  button { font: inherit; color: inherit; }
  svg { display: block; }
  :focus-visible { outline: 3px solid var(--red-deep); outline-offset: 2px; }
  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 16px; }
  @media (min-width: 560px) { .wrap { padding: 0 24px; } }
  .skip { position: absolute; left: -9999px; top: 8px; background: var(--ink); color: #fff; padding: 8px 12px; border-radius: 6px; z-index: 50; }
  .skip:focus { left: 8px; }
  .caps { font-family: var(--display); text-transform: uppercase; letter-spacing: .05em; }
  html[lang="ko"] .caps, html[lang^="zh"] .caps { text-transform: none; letter-spacing: 0; }

  /* Masthead */
  .masthead { background: var(--surface); }
  .doodle { height: 36px; background: #fff url("__DOODLE__") center / cover no-repeat; }
  .brand { display: flex; align-items: center; gap: 12px; padding: 12px 0 12px; }
  .brand img { width: 48px; height: 48px; border-radius: 50%; flex: none; }
  .brand h1 { font-family: var(--display); text-transform: uppercase; font-weight: 800; font-size: 26px; line-height: 28px; margin: 0; }
  .brand p { margin: 1px 0 0; color: var(--muted); font-size: 13px; line-height: 18px; }

  /* Language switcher: every language visible in its own script, scrolls only if a narrow screen forces it. */
  .langbar { display: flex; gap: 3px; margin: 0 -16px; padding: 5px 16px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .langbar::-webkit-scrollbar { display: none; }
  @media (min-width: 560px) { .langbar { margin: 0 -24px; padding: 5px 24px; } }
  .seg { flex: 1 1 auto; min-width: max-content; display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 9px; border: 1px solid var(--line); background: var(--surface); color: var(--body); border-radius: 999px; font-size: 13px; line-height: 17px; font-weight: 600; white-space: nowrap; cursor: pointer; }
  @media (min-width: 420px) { .seg { padding: 0 14px; font-size: 14px; } }
  .seg[aria-checked="true"] { background: var(--red-deep); border-color: var(--red-deep); color: #fff; font-weight: 700; }
  .autodetect { margin: 0 0 10px; font-size: 12.5px; line-height: 17px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .autodetect svg { width: 14px; height: 14px; flex: none; color: var(--control); }

  /* Sticky bar */
  .bar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
  .bar .wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; padding-top: 4px; padding-bottom: 4px; }
  .row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; scroll-padding: 0 16px; margin: 0 -16px; padding: 0 16px; }
  .row::-webkit-scrollbar { display: none; }
  @media (min-width: 560px) { .row { margin: 0 -24px; padding: 0 24px; scroll-padding: 0 24px; } }
  .row > * { flex: none; }
  .row .sep { width: 1px; background: var(--line); align-self: stretch; margin: 10px 4px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 44px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 0 14px; font-size: 14px; line-height: 18px; font-weight: 600; cursor: pointer; white-space: nowrap; color: var(--ink); text-decoration: none; }
  .chip[aria-current] { background: var(--red-deep); color: #fff; border-color: var(--red-deep); }
  .chip.tool { background: var(--ground); border-color: var(--ground); }
  .chip.tool svg { width: 17px; height: 17px; color: var(--red-deep); }
  .chip.tool.on { background: var(--red-deep); border-color: var(--red-deep); color: #fff; }
  .chip.tool.on svg { color: #fff; }
  .chip .count { display: inline-grid; place-items: center; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; background: #fff; color: var(--red-deep); font-size: 12px; font-weight: 700; }
  .summary { display: flex; align-items: flex-start; gap: 8px; min-width: 0; font-size: 13px; line-height: 18px; color: var(--body); padding-bottom: 2px; }
  .summary b { color: var(--red-deep); }
  .summary .grow { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; font: inherit; color: inherit; }
  .linkbtn { background: none; border: 0; padding: 0 2px; min-height: 18px; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; color: var(--red-deep); font-size: 13px; font-weight: 600; white-space: nowrap; }

  /* Buttons and pills */
  .pill { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; border: 1px solid var(--control); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 14px; line-height: 20px; font-weight: 600; cursor: pointer; white-space: nowrap; color: var(--ink); }
  .pill[aria-pressed="true"] { background: var(--red-deep); color: #fff; border-color: var(--red-deep); }
  .pill.ghost { border-color: var(--line); }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; border: 0; border-radius: 12px; padding: 0 18px; font-size: 16px; font-weight: 700; cursor: pointer; background: var(--red-deep); color: #fff; }
  .btn.quiet { background: var(--ground); color: var(--ink); }

  /* Specials */
  .specials { display: grid; gap: 10px; margin: 14px 0 0; grid-template-columns: 1fr; }
  @media (min-width: 560px) { .specials { grid-template-columns: 1fr 1fr; gap: 12px; } }
  .special { display: grid; grid-template-columns: 84px minmax(0, 1fr) 20px; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; color: inherit; text-decoration: none; }
  .special:active { background: var(--ground); }
  .special img { width: 84px; height: 84px; object-fit: cover; border-radius: 10px; display: block; }
  .special .eyebrow { font-family: var(--display); text-transform: uppercase; font-weight: 700; font-size: 12px; line-height: 14px; letter-spacing: .06em; color: var(--red-deep); }
  html[lang="ko"] .special .eyebrow, html[lang^="zh"] .special .eyebrow { text-transform: none; letter-spacing: 0; }
  .special h2 { font-family: var(--display); text-transform: uppercase; font-weight: 800; font-size: 21px; line-height: 23px; margin: 2px 0 3px; text-wrap: balance; }
  html[lang="ko"] .special h2, html[lang^="zh"] .special h2 { text-transform: none; font-size: 18px; line-height: 24px; }
  .special .price { font-size: 16px; line-height: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .special .price s { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .special .when { font-size: 13px; line-height: 18px; color: var(--body); margin: 1px 0 0; }
  .special .terms { font-size: 12px; line-height: 16px; color: var(--muted); margin: 3px 0 0; }
  .special svg { width: 20px; height: 20px; color: var(--control); }

  /* Allergen call-to-action strip */
  .cta { display: grid; grid-template-columns: 24px minmax(0, 1fr) 20px; gap: 12px; align-items: center; width: 100%; text-align: left; margin: 12px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 12px 12px 14px; cursor: pointer; }
  .cta:active { background: var(--ground); }
  .cta > svg:first-child { width: 24px; height: 24px; color: var(--red-deep); }
  .cta > svg:last-child { width: 20px; height: 20px; color: var(--control); }
  .cta b { display: block; font-size: 15px; line-height: 20px; }
  .cta small { display: block; font-size: 13px; line-height: 18px; color: var(--muted); }
  .cta.on { border-color: var(--red-deep); box-shadow: inset 0 0 0 1px var(--red-deep); }
  .cta.on b { color: var(--red-deep); }

  /* Sections and items */
  section.menu { margin: 28px 0 0; scroll-margin-top: calc(var(--bar-h) + 8px); }
  section.menu > header { border-bottom: 2px solid var(--ink); padding-bottom: 5px; }
  section.menu h2 { font-family: var(--display); text-transform: uppercase; font-weight: 800; color: var(--red); font-size: 28px; line-height: 30px; margin: 0; }
  html[lang="ko"] section.menu h2, html[lang^="zh"] section.menu h2 { text-transform: none; font-size: 24px; line-height: 30px; }
  .intro { color: var(--body); margin: 10px 0 0; max-width: 62ch; font-size: 15px; line-height: 22px; }
  .intro.small { font-size: 13px; line-height: 19px; color: var(--muted); margin-top: 4px; }
  .items { list-style: none; margin: 0; padding: 0; }
  .item { padding: 14px 0; border-bottom: 1px solid var(--line); scroll-margin-top: calc(var(--bar-h) + 8px); }
  .item.flagged { background: var(--flag-bg); box-shadow: inset 3px 0 0 var(--red-deep); border-radius: 10px; margin: 2px -10px; padding-left: 12px; padding-right: 10px; border-bottom-color: transparent; }
  .hide-flagged .item.flagged { display: none; }
  .has-photos .item { display: grid; grid-template-columns: minmax(0, 1fr) var(--thumb); gap: 12px; align-items: start; }
  .has-photos .item.no-photo { grid-template-columns: minmax(0, 1fr); }
  .compact { --thumb: 72px; }
  @media (min-width: 560px) { section.menu { --thumb: 112px; } .compact { --thumb: 88px; } .has-photos .item { gap: 16px; } }
  .item-body { min-width: 0; }
  .thumb-btn { display: block; width: var(--thumb); height: var(--thumb); padding: 0; border: 0; background: none; border-radius: 12px; cursor: zoom-in; transition: transform .15s var(--ease); }
  .thumb-btn:active { transform: scale(.95); }
  .pointer-focus:focus-visible { outline: 0; }
  .thumb { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; background: var(--line-soft); display: block; box-shadow: inset 0 0 0 1px rgba(27, 25, 23, .06); }
  .thumb.cutout { object-fit: contain; background: transparent; border-radius: 0; box-shadow: none; }
  .item-head { display: grid; grid-template-columns: minmax(0, 1fr) max-content; gap: 10px; align-items: baseline; }
  .item h3 { font-family: var(--display); text-transform: uppercase; font-weight: 700; font-size: 21px; line-height: 24px; margin: 0; min-width: 0; }
  html[lang="ko"] .item h3, html[lang^="zh"] .item h3 { text-transform: none; font-size: 18px; line-height: 24px; }
  .price { font-family: var(--text); font-weight: 700; font-size: 16px; line-height: 22px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .en-name { font-size: 13px; line-height: 18px; color: var(--muted); margin: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 5px 0 0; }
  .badge { font-family: var(--display); text-transform: uppercase; font-weight: 700; font-size: 12px; line-height: 16px; letter-spacing: .06em; color: var(--red-deep); border: 1px solid var(--red-deep); border-radius: 4px; padding: 2px 6px; }
  .badge.lunch { color: #fff; background: var(--red-deep); }
  .badge.refill { color: var(--body); border-color: var(--control); }
  html[lang="ko"] .badge, html[lang^="zh"] .badge { text-transform: none; letter-spacing: 0; }
  .tagline { margin: 3px 0 0; font-style: italic; color: var(--muted); font-size: 14px; line-height: 20px; }
  .desc { margin: 4px 0 0; color: var(--body); max-width: 62ch; font-size: 15px; line-height: 22px; }
  @media (min-width: 560px) { .desc { font-size: 16px; line-height: 24px; } }
  .variants { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; }
  .variants li { display: grid; grid-template-columns: minmax(0, 1fr) max-content; gap: 10px; align-items: baseline; font-weight: 600; font-size: 15px; line-height: 22px; }
  .variants .vplus { font-weight: 400; color: var(--body); font-size: 13px; }
  .note { margin: 8px 0 0; font-size: 14px; line-height: 20px; color: var(--body); padding-left: 10px; border-left: 2px solid var(--red-deep); }
  .sides { margin: 10px 0 0; padding: 8px 0 0; border-top: 1px dotted var(--line); }
  .lab { font-family: var(--display); text-transform: uppercase; letter-spacing: .05em; font-size: 13px; line-height: 19px; font-weight: 700; color: var(--muted); }
  html[lang="ko"] .lab, html[lang^="zh"] .lab { text-transform: none; letter-spacing: 0; }
  .shots { grid-column: 1 / -1; margin: 10px 0 0; }
  .shots ul { list-style: none; display: flex; gap: 10px; margin: 6px -16px 0; padding: 2px 16px 4px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .shots ul::-webkit-scrollbar { display: none; }
  @media (min-width: 560px) { .shots ul { margin: 6px -24px 0; padding: 2px 24px 4px; } }
  .shots li { flex: 0 0 auto; }
  .shot { display: grid; gap: 4px; justify-items: center; width: 76px; padding: 0; border: 0; background: none; cursor: zoom-in; }
  .shot img { width: 76px; height: 76px; object-fit: cover; border-radius: 10px; background: var(--line-soft); display: block; }
  .shot span { font-size: 12px; line-height: 16px; color: var(--body); text-align: center; }
  .shot:active img { transform: scale(.95); }
  .al { margin: 7px 0 0; font-size: 13px; line-height: 19px; color: var(--body); }
  /* The photo column is too narrow to hold the line, so it takes its own row and
     shrinks to fit against the right edge, sitting under the photo. */
  .has-photos .item > .al { grid-column: 1 / -1; justify-self: end; text-align: right; max-width: 100%; margin-top: 2px; }
  .has-photos .item.no-photo > .al { justify-self: start; text-align: left; }
  .al b { font-weight: 600; color: var(--ink); }
  .al mark { background: transparent; color: var(--red-deep); font-weight: 700; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 2px; }
  .addons { border: 2px solid var(--red); border-radius: 12px; padding: 10px 14px 4px; margin: 16px 0 0; }
  .addons > h3 { font-family: var(--display); text-transform: uppercase; font-weight: 800; color: var(--red-deep); font-size: 18px; line-height: 22px; margin: 0 0 2px; }
  html[lang="ko"] .addons > h3, html[lang^="zh"] .addons > h3 { text-transform: none; }
  .addons .item { padding: 10px 0; }
  /* Nothing in this block has a photo, so it must not reserve the photo column. */
  .has-photos .addons .item { grid-template-columns: minmax(0, 1fr); }
  .has-photos .addons .item > .al { margin-top: 7px; }
  .addons .item.flagged { margin: 2px -8px; padding-left: 10px; padding-right: 8px; }
  .addons .item:last-child { border-bottom: 0; }
  .addons .item h3 { font-size: 18px; line-height: 22px; }
  .empty { margin: 12px 0 0; font-size: 14px; line-height: 20px; color: var(--muted); font-style: italic; }

  /* Footer */
  footer.end { margin: 36px 0 0; background: var(--surface); border-top: 1px solid var(--line); }
  footer.end .wrap { padding-top: 22px; padding-bottom: calc(30px + env(safe-area-inset-bottom)); }
  .notice { font-size: 14px; line-height: 20px; color: var(--body); max-width: 66ch; margin: 0 0 14px; }
  .notice b { display: block; font-family: var(--display); text-transform: uppercase; letter-spacing: .05em; font-size: 13px; color: var(--ink); margin-bottom: 2px; }
  html[lang="ko"] .notice b, html[lang^="zh"] .notice b { text-transform: none; letter-spacing: 0; }
  .locs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 18px 0 22px; padding-top: 16px; border-top: 2px solid var(--ink); }
  .locs h3 { font-family: var(--display); text-transform: uppercase; font-weight: 800; color: var(--red); font-size: 20px; line-height: 24px; margin: 0 0 2px; }
  .locs address { font-style: normal; font-size: 14px; line-height: 20px; color: var(--body); }
  .locs a { text-decoration: none; display: inline-block; padding: 6px 0; }
  .fine { margin: 18px 0 0; font-size: 13px; line-height: 19px; color: var(--muted); }
  .pdfs { margin: 18px 0 0; font-size: 14px; line-height: 24px; color: var(--body); }
  .pdfs a { font-weight: 600; display: inline-block; padding: 5px 0; }

  /* Sheets (language, allergen filter) */
  dialog { color: inherit; }
  dialog.sheet { position: fixed; inset: auto 0 0 0; margin: 0; width: 100%; max-width: 100%; max-height: min(88dvh, 88vh); border: 0; border-radius: 18px 18px 0 0; padding: 0; background: var(--surface); box-shadow: 0 -8px 40px rgba(27, 25, 23, .18); overflow: hidden; display: none; flex-direction: column; transform: translateY(102%); transition: transform .32s var(--ease); }
  dialog.sheet[open] { display: flex; transform: none; }
  dialog.sheet.closing { transform: translateY(102%); }
  dialog.sheet::backdrop { background: rgba(27, 25, 23, .48); transition: opacity .32s; }
  dialog.sheet.closing::backdrop { opacity: 0; }
  @starting-style { dialog.sheet[open] { transform: translateY(102%); } dialog.sheet[open]::backdrop { opacity: 0; } }
  @media (min-width: 720px) {
    dialog.sheet { inset: 0; margin: auto; width: min(480px, 92vw); max-height: min(80dvh, 80vh); border-radius: 18px; transform: translateY(16px) scale(.98); opacity: 0; transition: transform .26s var(--ease), opacity .26s; }
    dialog.sheet[open] { transform: none; opacity: 1; }
    dialog.sheet.closing { transform: translateY(16px) scale(.98); opacity: 0; }
    @starting-style { dialog.sheet[open] { transform: translateY(16px) scale(.98); opacity: 0; } }
  }
  .sheet-head { display: grid; grid-template-columns: minmax(0, 1fr) 44px; align-items: center; gap: 8px; padding: 14px 8px 8px 20px; flex: none; }
  .sheet-head::before { content: ""; position: absolute; top: 8px; left: 50%; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: var(--line); }
  @media (min-width: 720px) { .sheet-head::before { display: none; } }
  .sheet-head h2 { font-family: var(--display); text-transform: uppercase; font-weight: 800; font-size: 24px; line-height: 28px; margin: 6px 0 0; }
  html[lang="ko"] .sheet-head h2, html[lang^="zh"] .sheet-head h2 { text-transform: none; font-size: 20px; }
  .x { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; border-radius: 50%; cursor: pointer; color: var(--body); }
  .x span { width: 32px; height: 32px; border-radius: 50%; background: var(--ground); display: grid; place-items: center; }
  .x svg { width: 16px; height: 16px; }
  .sheet-body { overflow-y: auto; overscroll-behavior: contain; padding: 6px 20px calc(20px + env(safe-area-inset-bottom)); flex: 1 1 auto; }
  .sheet-hint { margin: 0 0 12px; font-size: 14px; line-height: 20px; color: var(--body); }
  .opts { display: grid; margin: 0 -8px; }
  .opt { display: grid; grid-template-columns: minmax(0, 1fr) 24px; align-items: center; gap: 12px; width: 100%; text-align: left; min-height: 56px; padding: 8px 12px; border: 0; background: none; border-radius: 12px; cursor: pointer; }
  .opt:active { background: var(--ground); }
  .opt .native { display: block; font-size: 17px; line-height: 22px; font-weight: 600; }
  .opt .eng { display: block; font-size: 13px; line-height: 18px; color: var(--muted); }
  .opt svg { width: 24px; height: 24px; color: var(--red-deep); visibility: hidden; }
  .opt[aria-checked="true"] svg { visibility: visible; }
  .opt[aria-checked="true"] .native { color: var(--red-deep); }
  .avoid { display: flex; flex-wrap: wrap; gap: 8px; }
  .sheet-status { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin: 14px 0 0; font-size: 14px; line-height: 20px; color: var(--body); }
  .sheet-status .status { font-weight: 600; color: var(--ink); }
  .sheet-foot { position: sticky; bottom: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; padding: 12px 0 0; margin-top: 16px; background: var(--surface); box-shadow: 0 -12px 12px -6px var(--surface); }
  .sheet-foot .btn.quiet { padding: 0 16px; }

  /* Photo viewer */
  dialog.lb { position: fixed; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: transparent; color: #fff; overflow: hidden; display: none; touch-action: none; }
  dialog.lb[open] { display: block; }
  dialog.lb::backdrop { background: transparent; }
  .lb-bg { position: absolute; inset: 0; background: #000; opacity: 0; }

function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
/* Language: an explicit choice in the URL wins, then a remembered one, then the device's own preference list.

    if (DATA.strings[hit]) { state.detected = hit !== "en"; return hit; }
  }
  return "en";
}
const ORDER = DATA.structure.allergens;
const merged = e => { const set = new Set([...(e.contains || []), ...(e.likely || [])]); return ORDER.filter(a => set.has(a)); };

/* Photos, in menu order. */
const PHOTOS = []; const PHOTO_INDEX = {}; const VARIANT_INDEX = {};
DATA.structure.sections.forEach(sec => sec.items.forEach(it => {
  const f = DATA.photos[it.id], rows = DATA.variants[it.id] || [];
  if (f && rows.length < 2) {
    const full = DATA.full[it.id];
    PHOTO_INDEX[it.id] = PHOTOS.length;
    PHOTOS.push({ id: it.id, thumb: "img/" + f, full: full ? "img/full/" + full.f : "img/" + f, w: full ? full.w : 1, h: full ? full.h : 1, cutout: f.endsWith(".png"), single: it.prices.length === 1 && it.prices[0].k === undefined ? it.prices[0] : null });
  }

function containsHTML(entry) {

}
function nameBlock(k) {

}
function badgesHTML(it) {

}

  const pi = kind === "item" ? PHOTO_INDEX[it.id] : undefined;

  if (pi !== undefined) {
    const p = PHOTOS[pi];
    photo = `<button class="thumb-btn" type="button" data-photo="${pi}" aria-label="${esc(t("ui.photoOf").replace("{name}", t(k + ".name")))}" aria-haspopup="dialog"><img class="thumb${p.cutout ? " cutout" : ""}" src="${p.thumb}" alt="" loading="lazy" width="84" height="84"></button>`;
  }
  return `<li class="item${kind === "item" && pi === undefined ? " no-photo" : ""}" id="item-${it.id}" data-kind="${kind}" data-allergens="${allOf(it).join(" ")}">

/* Dishes served several ways get a scrollable strip of what each one looks like.

function optionShotsHTML(it, k) {

function sectionHTML(sec) {

function render() {

function syncUrl() { const u = new URL(location.href); u.searchParams.set("lang", state.lang); history.replaceState(history.state, "", u); }
function setLang(code) {

$("lbNext").addEventListener("click", () => lbGoto(LB.index + 1, true));
document.addEventListener("keydown", e => {
  document.querySelectorAll(".pointer-focus").forEach(b => b.classList.remove("pointer-focus"));
  if (!LB.dlg.open || LB.dlg.classList.contains("closing")) return;
  if (e.key === "ArrowRight") { e.preventDefault(); lbGoto(LB.index + 1, true); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); lbGoto(LB.index - 1, true); }
});
window.addEventListener("resize", () => {
  if (!LB.dlg.open) return;
  lbCancelGesture();
  [...LB.zooms, LB.bg, LB.chrome].forEach(el => el.getAnimations().forEach(a => a.finish()));
  lbLayout(); lbSetZoom(LB.index, 1, 0, 0, false); lbPlaceTrack(false);
});
$("main").addEventListener("click", e => {
  const b = e.target.closest("[data-photo]"); if (!b) return;
  if (navigator.vibrate) navigator.vibrate(10);
  lbOpen(+b.dataset.photo, b, e.detail === 0);
});

if ("ResizeObserver" in window) new ResizeObserver(syncBarHeight).observe($("bar"));
state.lang = pickLang();
(load("sup-avoid") || "").split(",").filter(a => ORDER.includes(a)).forEach(a => state.avoid.add(a));
/* A menu always opens at the top. A leftover fragment from a tapped special, or a scroll position the browser
   restores, would otherwise drop a diner into the middle of the menu. */
if ("scrollRestoration" in history) history.scrollRestoration = "manual";
if (location.hash) { const u = new URL(location.href); u.hash = ""; history.replaceState(history.state, "", u); }
render();
window.scrollTo(0, 0);
addEventListener("pageshow", e => { if (e.persisted) window.scrollTo(0, 0); });
</script>
