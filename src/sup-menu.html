  .seg { flex: 1 1 auto; min-width: max-content; display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 9px; border: 1px solid var(--line); background: var(--surface); color: var(--body); border-radius: 999px; font-size: 0.8125rem; line-height: 1.0625rem; font-weight: 600; white-space: nowrap; cursor: pointer; }

  /* Buttons and pills */

  /* Specials */

  /* Allergen call-to-action strip */
  .cta { display: grid; grid-template-columns: 24px minmax(0, 1fr) 20px; gap: 12px; align-items: center; width: 100%; text-align: start; margin: 12px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding-block: 12px; padding-inline: 14px 12px; cursor: pointer; }

  /* Sections and items */
  section.menu { margin: 28px 0 0; scroll-margin-top: calc(var(--bar-h) + 8px); }

  .item-head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  .item-head h3 { flex: 1 1 auto; max-width: 100%; }
  /* A long translated name pushes the price onto its own line. It stays hard right there,
     rather than dropping to the left gutter where it reads as a stray number. */
  .item-head > .price { flex: none; margin-inline-start: auto; max-width: 100%; }
  .item h3 { font-family: var(--display); text-transform: uppercase; font-weight: 700; font-size: 1.3125rem; line-height: 1.5rem; margin: 0; min-width: 0; }
  html[lang="ko"] .item h3, html[lang^="zh"] .item h3 { text-transform: none; font-size: 1.125rem; line-height: 1.5rem; }
  .price { font-family: var(--text); font-weight: 700; font-size: 1rem; line-height: 1.375rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .en-name { font-size: 0.8125rem; line-height: 1.125rem; color: var(--muted); margin: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 5px 0 0; }
  .badge { font-family: var(--display); text-transform: uppercase; font-weight: 700; font-size: 0.75rem; line-height: 1rem; letter-spacing: .06em; color: var(--red-deep); border: 1px solid var(--red-deep); border-radius: 4px; padding: 2px 6px; }

  .tagline { margin: 3px 0 0; font-style: italic; color: var(--muted); font-size: 0.875rem; line-height: 1.25rem; }
  .desc { margin: 4px 0 0; color: var(--body); max-width: 62ch; font-size: 0.9375rem; line-height: 1.375rem; }
  @media (min-width: 560px) { .desc { font-size: 1rem; line-height: 1.5rem; } }
  .variants { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; }
  .variants li { display: grid; grid-template-columns: minmax(0, 1fr) max-content; gap: 10px; align-items: baseline; font-weight: 600; font-size: 0.9375rem; line-height: 1.375rem; }
  .variants .vplus { font-weight: 400; color: var(--body); font-size: 0.8125rem; }
  .note { margin: 8px 0 0; font-size: 0.875rem; line-height: 1.25rem; color: var(--body); padding-inline-start: 10px; border-inline-start: 2px solid var(--red-deep); }
  .sides { margin: 10px 0 0; padding: 8px 0 0; border-top: 1px dotted var(--line); }
  .lab { font-family: var(--display); text-transform: uppercase; letter-spacing: .05em; font-size: 0.8125rem; line-height: 1.1875rem; font-weight: 700; color: var(--muted); }
  html[lang="ko"] .lab, html[lang^="zh"] .lab { text-transform: none; letter-spacing: 0; }
  .shots { grid-column: 1 / -1; margin: 10px 0 0; }
  .shots ul { list-style: none; display: flex; gap: 10px; margin: 6px -16px 0; padding: 2px 16px 4px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .shots ul::-webkit-scrollbar { display: none; }

  .shots li { flex: 0 0 auto; }

  .has-photos .item.no-photo > .shots.side ul { flex-direction: column; align-items: center; gap: 10px; margin: 6px 0 0; padding: 0; overflow: visible; }

  .shot { display: grid; gap: 4px; justify-items: center; width: 76px; padding: 0; border: 0; background: none; cursor: zoom-in; scroll-margin-top: calc(var(--bar-h) + 8px); }
  .shot img { width: 76px; height: 76px; object-fit: cover; border-radius: 10px; background: var(--line-soft); display: block; }

  .al b { font-weight: 600; color: var(--ink); }
  .al mark { background: transparent; color: var(--red-deep); font-weight: 700; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; text-decoration-skip-ink: none; }
  .addons { border: 2px solid var(--red); border-radius: 12px; padding: 10px 14px 4px; margin: 16px 0 0; }
  .addons > h3 { font-family: var(--display); text-transform: uppercase; font-weight: 800; color: var(--red-deep); font-size: 1.125rem; line-height: 1.375rem; margin: 0 0 2px; }
  html[lang="ko"] .addons > h3, html[lang^="zh"] .addons > h3 { text-transform: none; }
  .addons .item { padding: 10px 0; }

  .has-photos .addons .item { grid-template-columns: minmax(0, 1fr); }
  .has-photos .addons .item > .al { margin-top: 7px; }
  .addons .item.flagged { margin: 2px -8px; padding-inline-start: 10px; padding-inline-end: 8px; }
  .addons .item:last-child { border-bottom: 0; }
  .addons .item h3 { font-size: 1.125rem; line-height: 1.375rem; }
  .empty { margin: 12px 0 0; font-size: 0.875rem; line-height: 1.25rem; color: var(--muted); font-style: italic; }

  /* Footer */
  footer.end { margin: 20px 0 0; background: var(--surface); border-top: 1px solid var(--line); }
  footer.end .wrap { padding-top: 14px; padding-bottom: calc(30px + env(safe-area-inset-bottom)); }
  .notice { font-size: 0.875rem; line-height: 1.25rem; color: var(--body); max-width: 66ch; margin: 0 0 14px; }
  .notice b { display: block; font-family: var(--display); text-transform: uppercase; letter-spacing: .05em; font-size: 0.8125rem; color: var(--ink); margin-bottom: 2px; }
  html[lang="ko"] .notice b, html[lang^="zh"] .notice b { text-transform: none; letter-spacing: 0; }
  .locs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 10px 0 22px; padding-top: 16px; border-top: 2px solid var(--ink); }
  .locs h3 { font-family: var(--display); text-transform: uppercase; font-weight: 800; color: var(--red); font-size: 1.25rem; line-height: 1.5rem; margin: 0 0 2px; }
  .locs address { font-style: normal; font-size: 0.875rem; line-height: 1.25rem; color: var(--body); }
  .locs a { text-decoration: none; display: inline-block; padding: 6px 0; }
  .fine { margin: 18px 0 0; font-size: 0.8125rem; line-height: 1.1875rem; color: var(--muted); }
  .pdfs { margin: 18px 0 0; font-size: 0.875rem; line-height: 1.5rem; color: var(--body); }

  /* Sheets (language, allergen filter) */
  dialog { color: inherit; }
  dialog.sheet { position: fixed; inset: auto 0 0 0; margin: 0; width: 100%; max-width: 100%; max-height: min(88dvh, 88vh); border: 0; border-radius: 18px 18px 0 0; padding: 0; background: var(--surface); box-shadow: 0 -8px 40px rgba(27, 25, 23, .18); overflow: hidden; display: none; flex-direction: column; transform: translateY(102%); transition: transform .32s var(--ease); }

  @media (min-width: 720px) {
    dialog.sheet { inset: 0; margin: auto; width: min(480px, 92vw); max-height: min(80dvh, 80vh); border-radius: 18px; transform: translateY(16px) scale(.98); opacity: 0; transition: transform .26s var(--ease), opacity .26s; }
    dialog.sheet[open] { transform: none; opacity: 1; }
    dialog.sheet.closing { transform: translateY(16px) scale(.98); opacity: 0; }
    @starting-style { dialog.sheet[open] { transform: translateY(16px) scale(.98); opacity: 0; } }
  }
  .sheet-head { display: grid; grid-template-columns: minmax(0, 1fr) 44px; align-items: center; gap: 8px; padding-block: 14px 8px; padding-inline: 20px 8px; flex: none; }
  .sheet-head::before { content: ""; position: absolute; top: 8px; inset-inline-start: 50%; width: 36px; height: 4px; margin-inline-start: -18px; border-radius: 2px; background: var(--line); }
  @media (min-width: 720px) { .sheet-head::before { display: none; } }
  .sheet-head h2 { font-family: var(--display); text-transform: uppercase; font-weight: 800; font-size: 1.5rem; line-height: 1.75rem; margin: 6px 0 0; }
  html[lang="ko"] .sheet-head h2, html[lang^="zh"] .sheet-head h2 { text-transform: none; font-size: 1.25rem; }
  .x { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; border-radius: 50%; cursor: pointer; color: var(--body); }
  .x span { width: 32px; height: 32px; border-radius: 50%; background: var(--ground); display: grid; place-items: center; }
  .x svg { width: 16px; height: 16px; }
  .sheet-body { overflow-y: auto; overscroll-behavior: contain; padding: 6px 20px calc(20px + env(safe-area-inset-bottom)); flex: 1 1 auto; }
  .sheet-hint { margin: 0 0 12px; font-size: 0.875rem; line-height: 1.25rem; color: var(--body); }
  .opts { display: grid; margin: 0 -8px; }
  .opt { display: grid; grid-template-columns: minmax(0, 1fr) 24px; align-items: center; gap: 12px; width: 100%; text-align: start; min-height: 56px; padding: 8px 12px; border: 0; background: none; border-radius: 12px; cursor: pointer; }

  .opt .eng { display: block; font-size: 0.8125rem; line-height: 1.125rem; color: var(--muted); }
  .opt svg { width: 24px; height: 24px; color: var(--red-deep); visibility: hidden; }
  .opt[aria-checked="true"] svg { visibility: visible; }
  .opt[aria-checked="true"] .native { color: var(--red-deep); }
  .avoid { display: flex; flex-wrap: wrap; gap: 8px; }
  .sheet-status { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin: 14px 0 0; font-size: 0.875rem; line-height: 1.25rem; color: var(--body); }
  .sheet-status .status { font-weight: 600; color: var(--ink); }
  .sheet-foot { position: sticky; bottom: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; padding: 12px 0 0; margin-top: 16px; background: var(--surface); box-shadow: 0 -12px 12px -6px var(--surface); }

  /* Photo viewer */
  dialog.lb { position: fixed; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: transparent; color: #fff; overflow: hidden; display: none; touch-action: none; }

  dialog.lb::backdrop { background: transparent; }

  .lb-zoom { position: relative; transform-origin: center; background-position: center; background-size: cover; overflow: hidden; touch-action: none; }
  .lb-zoom img { display: block; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .25s; pointer-events: none; -webkit-user-drag: none; }

<main class="wrap" id="main" tabindex="-1"><noscript><style>.masthead,.bar,footer.end,.skip{display:none} #sup-nojs{padding-block:20px} #sup-nojs article{border-bottom:1px solid var(--line);padding:8px 0} #sup-nojs p{margin:6px 0} #sup-nojs a{overflow-wrap:anywhere}</style><div id="sup-nojs" lang="en" dir="ltr"><h1>SUP Noodle Bar Menu</h1><p>Vietnamese noodle bar in Buena Park and Irvine</p><p>Reading the allergen tags: Each dish lists the major allergens it contains: dairy, egg, fish, shellfish, peanut, tree nuts, gluten, soy, and sesame. Options that add an allergen show it next to the option. Dishes with no major allergen listed show no Contains line.</p><h2>Beef Belly Pho lunch special</h2><p><bdi dir="ltr">$11.99</bdi> <s><bdi dir="ltr">$16</bdi></s></p><p>Seasonal offer</p><p>Monday to Friday, 10 AM to 4 PM</p><p>Dine-in only, excluding holidays. Valid at all SUP Noodle Bar locations. Add-ons and extras cost extra. Limited time only.</p><h2>Kimchi Fried Rice</h2><p>Now available</p><p>With Spam, soft tofu, or filet mignon</p><section><h2>Appetizers</h2><article><h3>Golden Bao</h3><p>Fried pork dumpling</p><p>Ground pork shoulder, caramelized onions, mushrooms, and a hard-boiled egg, wrapped in homemade dough and fried to a crisp.</p><p>Three baos · <bdi dir="ltr">$13</bdi></p><p>One bao · <bdi dir="ltr">$4.50</bdi></p><p><b>Contains:</b> Dairy, Egg, Fish, Shellfish, Gluten, Soy</p></article><article><h3>Spring Roll</h3><p>Shrimp</p><p>Fresh bean sprouts, mint, lettuce, and vermicelli wrapped in rice paper. Served with peanut sauce.</p><p><bdi dir="ltr">$9.50</bdi></p><p><b>Contains:</b> Shellfish, Peanut, Gluten, Soy, Sesame</p></article><article><h3>Egg Rolls</h3><p>Ground pork, mushrooms, onions, carrots, and glass noodles, deep-fried until crispy. Served with pickled carrots, vermicelli, lettuce, and sweet and sour fish sauce.</p><p>Three rolls · <bdi dir="ltr">$10</bdi></p><p>Add one roll (four rolls total) · <bdi dir="ltr">+$2.50</bdi></p><p><b>Contains:</b> Egg, Fish, Shellfish, Gluten, Soy, Sesame</p></article><article><h3>Shaken House Fries</h3><p>Colossal crisp fries topped with shaken beef belly, garlic, caramelized onions, sharp cheddar cheese, and spicy tartar sauce.</p><p><bdi dir="ltr">$20</bdi></p><p><b>Contains:</b> Dairy, Egg, Fish, Shellfish, Gluten, Soy, Sesame</p></article><article><h3>Truffle Fries</h3><p>Colossal crisp fries tossed with fresh herbs, parmesan cheese, and Italian truffle oil. Served with spicy aji verde aioli, ketchup, and spicy mayo.</p><p><bdi dir="ltr">$13.50</bdi></p><p><b>Contains:</b> Dairy, Egg, Shellfish, Gluten, Soy</p></article><article><h3>Parmesan Fries</h3><p>Colossal crisp fries tossed in fresh herbs and garlic, topped with parmesan cheese. Served with spicy aji verde aioli, ketchup, and spicy mayo.</p><p><bdi dir="ltr">$13</bdi></p><p><b>Contains:</b> Dairy, Egg, Shellfish, Gluten, Soy</p></article><article><h3>Chicken Wings</h3><p>Crispy fried chicken wings.</p><p>The parmesan wings contain dairy.</p><p>Garlic · <bdi dir="ltr">$16</bdi></p><p>Parmesan · <bdi dir="ltr">$17</bdi></p><p><b>Contains:</b> Dairy, Egg, Shellfish, Gluten, Soy</p></article><article><h3>Chicken Nugget Basket</h3><p>Crispy nuggets with colossal crisp fries, ketchup, and spicy mayo.</p><p><bdi dir="ltr">$12.50</bdi></p><p><b>Contains:</b> Egg, Shellfish, Gluten, Soy</p></article></section><section><h2>Pho</h2><p>Thin rice noodles served in beef bone broth, garnished with white onions, scallions, and cilantro. Free unlimited noodle refills with dine-in pho.</p><p>Every pho, including the veggie and tofu bowl, is made with beef bone broth.</p><article><h3>Pho Short Rib</h3><p>Boneless</p><p>Thinly sliced boneless short rib, rich in flavor and melt-in-your-mouth tender.</p><p><bdi dir="ltr">$18</bdi></p><p><b>Contains:</b> Fish, Shellfish</p></article><article><h3>Pho Rib Bones</h3><p>Two bones</p><p>Fall-off-the-bone beef ribs, braised for four hours for a deep, hearty flavor.</p><p><bdi dir="ltr">$19</bdi></p><p><b>Contains:</b> Fish, Shellfish</p></article><article><h3>Pho Beef Belly</h3><p>Thinly sliced marbled beef belly.</p><p>Weekday lunch special: $11.99, dine-in only, 10 AM to 4 PM.</p><p><bdi dir="ltr">$16</bdi></p><p><b>Contains:</b> Fish, Shellfish</p></article><article><h3>Pho Filet Mignon</h3><p>Lean filet mignon, tender and flavorful.</p><p><bdi dir="ltr">$18.50</bdi></p><p><b>Contains:</b> Fish, Shellfish</p></article><article><h3>Pho Combination</h3><p>A mix of beef belly, tendon, brisket, meatball, and one rib bone.</p><p>No meat substitutions.</p><p><bdi dir="ltr">$20</bdi></p><p><b>Contains:</b> Fish, Shellfish, Gluten, Soy</p></article><article><h3>Pho Veggie and Tofu</h3><p>Tofu, broccoli, carrots, and napa cabbage in a rich beef broth.</p><p>Made with beef broth, so this bowl is not vegetarian.</p><p><bdi dir="ltr">$16.50</bdi></p><p><b>Contains:</b> Fish, Shellfish, Gluten, Soy</p></article><article><h3>Pho Brisket</h3><p>Four-hour-braised brisket, tender with a slight chew.</p><p><bdi dir="ltr">$18</bdi></p><p><b>Contains:</b> Fish, Shellfish</p></article><article><h3>Pho Shrimp</h3><p>Large poached shrimp, light and fresh.</p><p><bdi dir="ltr">$17.50</bdi></p><p><b>Contains:</b> Fish, Shellfish</p></article><article><h3>Pho Meatballs</h3><p>Vietnamese tendon meatballs.</p><p><bdi dir="ltr">$16</bdi></p><p><b>Contains:</b> Fish, Shellfish, Gluten, Soy</p></article><article><h3>Pho Anthony Bourdain</h3><p>Wok-seared scallions, red onions, and minced garlic with filet mignon and flat noodles. Smoky and packed with flavor.</p><p><bdi dir="ltr">$20</bdi></p><p><b>Contains:</b> Fish, Shellfish, Gluten, Soy</p></article><article><h3>Beef Belly Dry Noodle</h3><p>Stir-fried beef belly in lemongrass sauce, served over fresh spring mix, vegetables, and flat noodles. Garnished with roasted peanuts, fried shallots, and fresh herbs. Served dry, without soup.</p><p><bdi dir="ltr">$15.50</bdi></p><p><b>Contains:</b> Fish, Shellfish, Peanut, Gluten, Soy</p></article><h3>Make it yours</h3><article><h3>Make your pho shaken style</h3><p>Wok-seared garlic, scallions, and red onions in bone marrow oil. Adds a depth of smokiness for a distinct northern-style flavor.</p><p><bdi dir="ltr">+$0.50</bdi></p></article><article><h3>Add a sous vide egg</h3><p>Slow-poached egg that adds a milky richness to your broth.</p><p><bdi dir="ltr">+$2</bdi></p><p><b>Contains:</b> Egg</p></article><article><h3>Add a numbing sensation</h3><p>House-made mala chili oil.</p><p><bdi dir="ltr">+$1</bdi></p><p><b>Contains:</b> Peanut, Sesame</p></article><article><h3>Make your pho spicy</h3><p>House-made chili paste with lemongrass.</p><p><bdi dir="ltr">+$1</bdi></p><p><b>Contains:</b> Fish, Shellfish</p></article></section><section><h2>Rice and noodle plates</h2><article><h3>Lomo Saltado</h3><p>Thick-cut fries, charred sweet red onions, tomatoes, and white wine soy with your choice of protein and steamed white rice. Served with house-made spicy aji verde aioli.</p><p>The aji verde aioli contains egg and parmesan cheese, so the aji verde aioli sauce is not vegan.</p><p>Filet mignon · <bdi dir="ltr">$25</bdi></p><p>Shrimp · <bdi dir="ltr">$22</bdi></p><p>Vegan tofu · <bdi dir="ltr">$17.50</bdi></p><p><b>Contains:</b> Dairy, Egg, Shellfish, Gluten, Soy, Sesame</p><h4>Add a side</h4><article><h3>Fried egg</h3><p><bdi dir="ltr">+$2.50</bdi></p><p><b>Contains:</b> Egg</p></article><article><h3>Soft-boiled egg</h3><p><bdi dir="ltr">+$2</bdi></p><p><b>Contains:</b> Egg</p></article></article><article><h3>Cajun Garlic Noodles</h3><p>Wheat noodles tossed in butter and Cajun garlic sauce, finished with fresh scallions. Served with house-made spicy aji verde aioli.</p><p>The shrimp and sausage plate contains shellfish.</p><p>Shrimp and sausage · <bdi dir="ltr">$22</bdi></p><p>Filet mignon · <bdi dir="ltr">$23</bdi></p><p><b>Contains:</b> Sesame</p><p><b>Contains:</b> Dairy, Egg, Fish, Shellfish, Gluten, Soy</p><h4>Add a side</h4><article><h3>Fried egg</h3><p><bdi dir="ltr">+$2.50</bdi></p><p><b>Contains:</b> Egg</p></article><article><h3>Soft-boiled egg</h3><p><bdi dir="ltr">+$2</bdi></p><p><b>Contains:</b> Egg</p></article></article><article><h3>Fried Rice</h3><p>Your choice of protein with scrambled eggs and scallions. Served with house-made spicy aji verde aioli on the side.</p><p>The shrimp plate contains shellfish. Tofu plates contain soy. Chicken wings are breaded with wheat.</p><p>Shrimp · <bdi dir="ltr">$22.50</bdi></p><p>Spam · <bdi dir="ltr">$20</bdi></p><p>Chicken wings · <bdi dir="ltr">$24.50</bdi></p><p>Filet mignon · <bdi dir="ltr">$23.50</bdi></p><p><b>Contains:</b> Sesame</p><p>Soft tofu · <bdi dir="ltr">$15.50</bdi></p><p>Fried tofu · <bdi dir="ltr">$17</bdi></p><p><b>Contains:</b> Dairy, Egg, Shellfish, Gluten, Soy</p><h4>Add a side</h4><article><h3>Fried egg</h3><p><bdi dir="ltr">+$2.50</bdi></p><p><b>Contains:</b> Egg</p></article><article><h3>Soft-boiled egg</h3><p><bdi dir="ltr">+$2</bdi></p><p><b>Contains:</b> Egg</p></article></article><article><h3>Kimchi Fried Rice</h3><p>The house fried rice tossed with kimchi, with scrambled eggs and scallions. Served with house-made spicy aji verde aioli on the side.</p><p>Kimchi is usually fermented with fish sauce and salted shrimp. The soft tofu plate contains soy.</p><p>Spam · <bdi dir="ltr">$22.50</bdi></p><p>Soft tofu · <bdi dir="ltr">$19.50</bdi></p><p>Filet mignon · <bdi dir="ltr">$24.50</bdi></p><p><b>Contains:</b> Dairy, Egg, Fish, Shellfish, Gluten, Soy, Sesame</p><h4>Add a side</h4><article><h3>Fried egg</h3><p><bdi dir="ltr">+$2.50</bdi></p><p><b>Contains:</b> Egg</p></article><article><h3>Soft-boiled egg</h3><p><bdi dir="ltr">+$2</bdi></p><p><b>Contains:</b> Egg</p></article></article></section><section><h2>Extras</h2><article><h3>Side of Noodles</h3><p>Unlimited with dine-in pho orders.</p></article><article><h3>Side of Broth</h3><p><bdi dir="ltr">$3</bdi></p><p><b>Contains:</b> Fish, Shellfish</p></article><article><h3>Side of Rice</h3><p><bdi dir="ltr">$2</bdi></p></article><article><h3>Fried Egg</h3><p><bdi dir="ltr">$2.50</bdi></p><p><b>Contains:</b> Egg</p></article><article><h3>Slow Poached Egg</h3><p><bdi dir="ltr">$2</bdi></p><p><b>Contains:</b> Egg</p></article><article><h3>Soy and Butter Noodle</h3><p><bdi dir="ltr">$8.50</bdi></p><p><b>Contains:</b> Dairy, Egg, Fish, Shellfish, Gluten, Soy</p></article></section><section><h2>Kids</h2><article><h3>Kids Meal Box</h3><p>Crispy golden chicken nuggets and seasoned fries, with a juice box to complete the meal.</p><p><bdi dir="ltr">$8</bdi></p><p><b>Contains:</b> Egg, Shellfish, Gluten, Soy</p></article></section><section><h2>Drinks</h2><p>Free refills on drinks marked with the refill tag.</p><article><h3>Yuzu Peach</h3><p><bdi dir="ltr">$5.50</bdi></p></article><article><h3>Herbal Iced Tea</h3><p>A blend of pandan and artichoke.</p><p><bdi dir="ltr">$4</bdi></p></article><article><h3>Thai Iced Tea</h3><p>Sweet and creamy with strong black tea notes.</p><p><bdi dir="ltr">$5.50</bdi></p><p><b>Contains:</b> Dairy</p></article><article><h3>Lychee Lemonade or Soda</h3><p>Blended lychee with lemonade or soda.</p><p><bdi dir="ltr">$5.50</bdi></p></article><article><h3>Vietnamese Iced Coffee</h3><p><bdi dir="ltr">$6</bdi></p><p><b>Contains:</b> Dairy</p></article><article><h3>Strawberry Cream Soda</h3><p><bdi dir="ltr">$6</bdi></p><p><b>Contains:</b> Dairy</p></article><article><h3>Watermelon Refresher</h3><p><bdi dir="ltr">$5.50</bdi></p></article><article><h3>Passionfruit Green Tea</h3><p>Jasmine green tea and passionfruit purée.</p><p><bdi dir="ltr">$5.50</bdi></p></article><article><h3>Fountain Drink</h3><p>Coke, Diet Coke, Coke Zero, Fanta Strawberry, Ginger Ale, Barq&#x27;s Root Beer, Sprite, or Lemonade.</p><p><bdi dir="ltr">$4</bdi></p></article><article><h3>Shirley Temple</h3><p><bdi dir="ltr">$4.50</bdi></p></article><article><h3>Roy Rogers</h3><p><bdi dir="ltr">$4.50</bdi></p></article><article><h3>Jasmine Iced Tea</h3><p><bdi dir="ltr">$4</bdi></p></article><article><h3>Jasmine Hot Tea</h3><p><bdi dir="ltr">$2</bdi></p></article></section><p><b>Allergies and dietary needs</b> Please tell your server about any dietary restrictions or food allergies. We strongly advise guests with severe food allergies or sensitivities to exercise caution when dining at SUP. We make every effort to accommodate food allergies and keep our guests safe, but cross-contamination is always possible and we cannot guarantee an allergen-free environment. If you have any questions, please ask your server.</p><p><b>Undercooked food notice</b> Dishes prepared with soft-boiled, poached, sunny-side-up, or over-easy eggs, as well as rare or medium-rare steaks, may be undercooked. These items may be served raw or undercooked, or contain raw or undercooked ingredients. Consuming raw or undercooked meats, poultry, seafood, shellfish, or eggs may increase your risk of foodborne illness, especially if you have certain medical conditions.</p><p>Printable menu (PDF): <a href="pdf/SUP-Menu-en.pdf"><bdi lang="en">English</bdi></a> · <a href="pdf/SUP-Menu-es.pdf"><bdi lang="es">Español</bdi></a> · <a href="pdf/SUP-Menu-vi.pdf"><bdi lang="vi">Tiếng Việt</bdi></a> · <a href="pdf/SUP-Menu-ko.pdf"><bdi lang="ko">한국어</bdi></a> · <a href="pdf/SUP-Menu-zh.pdf"><bdi lang="zh">简体中文</bdi></a> · <a href="pdf/SUP-Menu-zh-Hant.pdf"><bdi lang="zh-Hant">繁體中文</bdi></a> · <a href="pdf/SUP-Menu-tl.pdf"><bdi lang="tl">Tagalog</bdi></a> · <a href="pdf/SUP-Menu-fa.pdf"><bdi lang="fa">فارسی</bdi></a> · <a href="pdf/SUP-Menu-ar.pdf"><bdi lang="ar">العربية</bdi></a> · <a href="pdf/SUP-Menu-ja.pdf"><bdi lang="ja">日本語</bdi></a> · <a href="pdf/SUP-Menu-ru.pdf"><bdi lang="ru">Русский</bdi></a> · <a href="pdf/SUP-Menu-hi.pdf"><bdi lang="hi">हिन्दी</bdi></a> · <a href="pdf/SUP-Menu-ur.pdf"><bdi lang="ur">اردو</bdi></a></p><p>Buena Park · 5141 Beach Blvd Unit B · 714-521-2444<br>Irvine · 14370 Culver Dr Unit 2H · 657-300-8420</p><p>@supnoodlebar<br><a href="https://www.keiconc chiEyebrow":"Đã có bán","ui.kimchiTitle":"Cơm chiên kim chi","ui.kimchiSub":"Với Spam, đậu hũ non hoặc filet mignon","ui.seeItem":"Xem món","ui.dineInOnly":"Chỉ dùng tại quán","ui.locations":"Địa điểm","ui.buenaPark":"Buena Park","ui.irvine":"Irvine","ui.allergyTitle":"Dị ứng và nhu cầu ăn uống đặc biệt","ui.allergyNotice":"Vui lòng báo cho nhân viên phục vụ về bất kỳ hạn chế nào trong ăn uống hoặc bất kỳ dị ứng thực phẩm nào. Chúng tôi đặc biệt khuyến cáo quý khách bị dị ứng hoặc nhạy cảm nặng với thực phẩm hãy thận trọng khi dùng bữa tại SUP. Chúng tôi cố gắng hết sức để đáp ứng nhu cầu của khách bị dị ứng thực phẩm và giữ an toàn cho quý khách, nhưng vẫn luôn có nguy cơ nhiễm chéo chất gây dị ứng và chúng tôi không thể bảo đảm một môi trường hoàn toàn không có chất gây dị ứng. Nếu có bất kỳ thắc mắc nào, vui lòng hỏi nhân viên phục vụ.","ui.rawTitle":"Lưu ý về thực phẩm chưa chín kỹ","ui.rawNotice":"Các món dùng trứng luộc lòng đào, trứng chần, trứng ốp la một mặt hoặc trứng ốp la hai mặt còn lòng đào, cũng như bít tết tái hoặc tái vừa, có thể chưa chín kỹ. Những món này có thể được phục vụ sống hoặc chưa chín kỹ, hoặc chứa nguyên liệu sống hay chưa chín kỹ. Tiêu thụ thịt, thịt gia cầm, hải sản, động vật có vỏ, hoặc trứng sống hoặc chưa nấu chín có thể làm tăng nguy cơ mắc bệnh truyền qua thực phẩm, đặc biệt nếu bạn mắc một số bệnh lý.","ui.phoRefill":"Thêm bánh phở không giới hạn, miễn phí khi dùng phở tại quán.","allergen.milk":"Bơ sữa","allergen.egg":"Trứng","allergen.fish":"Cá","allergen.shellfish":"Hải sản có vỏ","allergen.peanut":"Đậu phộng","allergen.treenut":"Hạt cây","allergen.gluten":"Gluten","allergen.soy":"Đậu nành","allergen.sesame":"Mè","sec.appetizers.title":"Món khai vị","sec.pho.title":"Phở","sec.pho.intro":"Bánh phở sợi mảnh chan nước dùng hầm xương bò, rắc hành tây trắng, hành lá và ngò. Thêm bánh phở không giới hạn, miễn phí khi dùng phở tại quán.","sec.pho.brothNote":"Tất cả các tô phở, kể cả phở rau củ và đậu hũ, đều nấu bằng nước dùng hầm xương bò.","sec.plates.title":"Cơm dĩa và mì","sec.extras.title":"Món thêm","sec.kids.title":"Món cho bé","sec.drinks.title":"Thức uống","item.bao.name":"Bánh bao chiên vàng","item.bao.tagline":"Bánh bao nhân thịt heo chiên","item.bao.desc":"Thịt vai heo xay, hành tây xào vàng, nấm và trứng luộc chín kỹ, bọc trong vỏ bánh nhà làm rồi chiên giòn.","item.bao.price.three":"Ba cái","item.bao.price.one":"Một cái","item.springroll.name":"Gỏi cuốn tôm","item.springroll.tagline":"Tôm","item.springroll.desc":"Giá tươi, húng lủi, xà lách và bún cuốn trong bánh tráng. Dùng kèm tương đậu phộng.","item.eggrolls.name":"Chả giò","item.eggrolls.desc":"Thịt heo xay, nấm, hành, cà rốt và miến, chiên giòn. Dùng kèm cà rốt ngâm chua, bún, xà lách và nước mắm chua ngọt.","item.eggrolls.price.three":"Ba cuốn","item.eggrolls.price.extra":"Thêm một cuốn (tổng cộng bốn cuốn)","item.shakenfries.name":"Khoai tây chiên bò lúc lắc","item.shakenfries.desc":"Khoai tây chiên giòn cỡ lớn phủ bò ba chỉ lúc lắc, tỏi, hành tây xào vàng, phô mai cheddar đậm vị và sốt tartar cay.","item.trufflefries.name":"Khoai tây chiên nấm truffle","item.trufflefries.desc":"Khoai tây chiên giòn cỡ lớn trộn rau thơm tươi, phô mai parmesan và dầu truffle Ý. Dùng kèm sốt aioli aji verde cay, tương cà và sốt mayo cay.","item.parmfries.name":"Khoai tây chiên phô mai parmesan","item.parmfries.desc":"Khoai tây chiên giòn cỡ lớn trộn rau thơm tươi và tỏi, phủ phô mai parmesan. Dùng kèm sốt aioli aji verde cay, tương cà và sốt mayo cay.","item.wings.name":"Cánh gà chiên","item.wings.desc":"Cánh gà chiên giòn.","item.wings.note":"Cánh gà phô mai parmesan có chứa bơ sữa.","item.wings.price.garlic":"Tỏi","item.wings.price.parmesan":"Phô mai parmesan","item.nuggets.name":"Gà viên chiên kèm khoai tây chiên","item.nuggets.desc":"Gà viên chiên giòn kèm khoai tây chiên giòn cỡ lớn, tương cà và sốt mayo cay.","item.phoshortrib.name":"Phở sườn bò không xương","item.phoshortrib.tagline":"Không xương","item.phoshortrib.desc":"Sườn bò không xương thái mỏng, đậm đà và mềm tan trong miệng.","item.phoribbones.name":"Phở sườn bò có xương","item.phoribbones.tagline":"Hai khúc sườn","item.phoribbones.desc":"Sườn bò hầm bốn tiếng, thịt mềm rục, dễ róc xương, hương vị đậm đà.","item.phobeefbelly.name":"Phở bò ba chỉ","item.phobeefbelly.desc":"Bò ba chỉ có vân mỡ, thái lát mỏng.","item.phobeefbelly.note":"Ưu đãi bữa trưa từ thứ Hai đến thứ Sáu: $11.99, chỉ dùng tại quán, từ 10 giờ sáng đến 4 giờ chiều.","item.phofilet.name":"Phở filet mignon","item.phofilet.desc":"Thăn bò filet mignon nạc, mềm và đậm vị.","item.phocombo.name":"Phở đặc biệt","item.phocombo.desc":"Gồm bò ba chỉ, gân, nạm, bò viên và một khúc sườn.","item.phocombo.note":"Không đổi loại thịt.","item.phoveggie.name":"Phở rau củ và đậu hũ","item.phoveggie.desc":"Đậu hũ, bông cải xanh, cà rốt và cải thảo trong nước dùng bò đậm đà.","item.phoveggie.note":"Nấu bằng nước dùng bò nên tô này không phải món chay.","item.phobrisket.name":"Phở nạm","item.phobrisket.desc":"Nạm bò hầm bốn tiếng, mềm mà vẫn dai nhẹ.","item.phoshrimp.name":"Phở tôm","item.phoshrimp.desc":"Tôm lớn luộc chín, thanh nhẹ và tươi ngon.","item.phomeatballs.name":"Phở bò viên","item.phomeatballs.desc":"Bò viên gân kiểu Việt Nam.","item.phobourdain.name":"Phở Anthony Bourdain","item.phobourdain.desc":"Hành lá, hành tây tím và tỏi băm xào lửa lớn cùng filet mignon và bánh phở sợi dẹp. Thơm mùi khói, đậm đà hương vị.","item.drynoodle.name":"Phở khô bò ba chỉ xào sả","item.drynoodle.desc":"Bò ba chỉ xào sốt sả, dọn trên hỗn hợp rau non tươi, rau củ và bánh phở sợi dẹp. Rắc đậu phộng rang, hành phi và rau thơm tươi. Dùng khô, không có nước dùng.","addon.shaken.name":"Phở kiểu lúc lắc","addon.shaken.desc":"Tỏi, hành lá và hành tây tím xào lửa lớn trong dầu tủy xương. Tạo hương thơm khói đậm đà, mang phong vị miền Bắc rất riêng.","addon.sousvide.name":"Thêm trứng sous vide","addon.sousvide.desc":"Trứng chần ở nhiệt độ thấp, giúp nước dùng thêm béo ngậy.","addon.mala.name":"Thêm vị tê cay mal 돼지고기, 버섯, 양파, 당근, 당면을 넣어 바삭하게 튀겼습니다. 당근 피클, 버미셀리, 상추, 새콤달콤한 피시 소스와 함께 드립니다.","item.eggrolls.price.three":"짜조 3개","item.eggrolls.price.extra":"1개 추가 (총 4개)","item.shakenfries.name":"셰이큰 하우스 감자튀김","item.shakenfries.desc":"굵고 바삭한 감자튀김 위에 볶은 우삼겹, 마늘, 캐러멜라이즈한 양파, 샤프 체다 치즈, 매콤한 타르타르 소스를 얹었습니다.","item.trufflefries.name":"트러플 감자튀김","item.trufflefries.desc":"굵고 바삭한 감자튀김에 신선한 허브, 파르메산 치즈, 이탈리아산 트러플 오일을 버무렸습니다. 매콤한 aji verde 아이올리, 케첩, 스파이시 마요와 함께 드립니다.","item.parmfries.name":"파르메산 감자튀김","item.parmfries.desc":"굵고 바삭한 감자튀김에 신선한 허브와 마늘을 버무리고 파르메산 치즈를 얹었습니다. 매콤한 aji verde 아이올리, 케첩, 스파이시 마요와 함께 드립니다.","item.wings.name":"치킨 윙","item.wings.desc":"바삭하게 튀긴 치킨 윙.","item.wings.note":"파르메산 윙에는 유제품이 포함되어 있습니다.","item.wings.price.garlic":"갈릭","item.wings.price.parmesan":"파르메산","item.nuggets.name":"치킨 너겟 바스켓","item.nuggets.desc":"바삭한 너겟과 굵은 감자튀김, 케첩, 스파이시 마요.","item.phoshortrib.name":"갈비 쌀국수","item.phoshortrib.tagline":"뼈 없는 갈비살","item.phoshortrib.desc":"얇게 썬 뼈 없는 갈비살로, 풍미가 깊고 입에서 살살 녹습니다.","item.phoribbones.name":"뼈갈비 쌀국수","item.phoribbones.tagline":"갈비 2대","item.phoribbones.desc":"4시간 동안 푹 삶아 뼈에서 살이 술술 떨어지는 소갈비, 깊고 진한 맛이 일품입니다.","item.phobeefbelly.name":"우삼겹 쌀국수","item.phobeefbelly.desc":"얇게 썬 마블링 좋은 우삼겹.","item.phobeefbelly.note":"평일 런치 스페셜: $11.99. 오전 10시부터 오후 4시까지 매장 식사 시에만 적용됩니다.","item.phofilet.name":"안심 쌀국수","item.phofilet.desc":"기름기 적고 부드러우며 풍미 가득한 안심.","item.phocombo.name":"모둠 쌀국수","item.phocombo.desc":"우삼겹, 힘줄, 양지, 미트볼, 갈비 1대를 함께 담았습니다.","item.phocombo.note":"고기 종류 변경은 불가합니다.","item.phoveggie.name":"채소·두부 쌀국수","item.phoveggie.desc":"진한 소고기 육수에 두부, 브로콜리, 당근, 배추를 넣었습니다.","item.phoveggie.note":"소고기 육수로 만들기 때문에 채식 메뉴가 아닙니다.","item.phobrisket.name":"양지 쌀국수","item.phobrisket.desc":"4시간 동안 푹 삶아 부드러우면서도 살짝 씹는 맛이 있는 양지.","item.phoshrimp.name":"새우 쌀국수","item.phoshrimp.desc":"큼직한 새우를 데쳐 담백하고 산뜻한 맛을 냈습니다.","item.phomeatballs.name":"미트볼 쌀국수","item.phomeatballs.desc":"베트남식 힘줄 미트볼.","item.phobourdain.name":"Anthony Bourdain 쌀국수","item.phobourdain.desc":"웍에 센 불로 볶은 파, 적양파, 다진 마늘에 안심과 넓적한 면을 곁들였습니 e":"鲜虾河粉","item.phoshrimp.desc":"大只白灼鲜虾，清爽鲜甜。","item.phomeatballs.name":"牛肉丸河粉","item.phomeatballs.desc":"越式牛筋丸。","item.phobourdain.name":"Anthony Bourdain 河粉","item.phobourdain.desc":"葱段、红洋葱和蒜蓉经大火爆香，配菲力牛柳和宽河粉。镬气十足，滋味浓郁。","item.drynoodle.name":"牛五花干捞河粉","item.drynoodle.desc":"香茅酱炒牛五花，铺在新鲜混合生菜、蔬菜和宽河粉上。撒上烤花生、炸红葱头和新鲜香草。干拌，不带汤。","addon.shaken.name":"河粉加爆香配料","addon.shaken.desc":"以牛骨髓油爆香蒜蓉、葱段和红洋葱，增添烟香层次，呈现独特的北越风味。","addon.sousvide.name":"加低温慢煮蛋","addon.sousvide.desc":"低温慢煮蛋，为汤底增添绵滑浓香。","addon.mala.name":"加麻辣风味","addon.mala.desc":"自制麻辣油。","addon.spicy.name":"河粉加辣","addon.spicy.desc":"自制香茅辣椒酱。","item.lomo.name":"秘鲁小炒（Lomo Saltado）","item.lomo.desc":"粗切薯条、焦香甜红洋葱、番茄和白葡萄酒酱油汁，配自选主料和白米饭。佐以自制香辣 aji verde 蒜香酱。","item.lomo.note":"aji verde 蒜香酱含有蛋和帕玛森芝士，因此 aji verde 蒜香酱并非纯素。","item.lomo.price.filet":"菲力牛柳","item.lomo.price.shrimp":"鲜虾","item.lomo.price.tofu":"纯素豆腐","addon.lomofriedegg.name":"煎蛋","addon.lomosoftegg.name":"溏心蛋","item.cajun.name":"Cajun 蒜香面","item.cajun.desc":"小麦面条拌以黄油和 Cajun 蒜香酱，撒上新鲜葱花。佐以自制香辣 aji verde 蒜香酱。","item.cajun.note":"鲜虾配香肠款含有甲壳类及软体海鲜过敏原。","item.cajun.price.shrimpsausage":"鲜虾配香肠","item.cajun.price.filet":"菲力牛柳","item.friedrice.name":"炒饭","item.friedrice.desc":"自选主料，配炒蛋和葱花。另附自制香辣 aji verde 蒜香酱。","item.friedrice.note":"鲜虾款含有甲壳类及软体海鲜过敏原。豆腐款含有大豆。鸡翅的外层裹粉含有小麦。","item.friedrice.price.shrimp":"鲜虾","item.friedrice.price.spam":"Spam 午餐肉","item.friedrice.price.wings":"炸鸡翅","item.friedrice.price.filet":"菲力牛柳","item.friedrice.price.softtofu":"嫩豆腐","item.friedrice.price.friedtofu":"炸豆腐","item.kimchi.name":"泡菜炒饭","item.kimchi.desc":"招牌炒饭拌入泡菜，配炒蛋和葱花。另附自制香辣 aji verde 蒜香酱。","item.kimchi.note":"泡菜通常用鱼露和盐渍虾发酵制成。嫩豆腐款含有大豆。","item.kimchi.price.spam":"Spam 午餐肉","item.kimchi.price.softtofu":"嫩豆腐","item.kimchi.price.filet":"菲力牛柳","item.sidenoodles.name":"加河粉","item.sidenoodles.desc":"堂食河粉可无限加粉。","item.sidebroth.name":"加汤","item.siderice.name":"加白饭","item.friedegg.name":"煎蛋","item.poachedegg.name":"低温慢煮蛋","item.soybutter.name":"酱油黄油拌面","item.kidsbox.name":"儿童套餐","item.kidsbox.desc":"金 to","ui.rawNotice":"Maaaring hindi lubos na luto ang mga pagkaing may itlog na nilaga na malambot pa ang pula, itlog na niluto sa tubig nang walang balat, itlog na pinirito sa isang panig lamang, o itlog na bahagyang pinirito sa magkabilang panig na malabnaw pa ang pula, pati na ang mga steak na bahagya lang ang pagkaluto (rare o medium-rare). Maaaring ihain ang mga ito nang hilaw o kulang sa luto, o may sangkap na hilaw o kulang sa luto. Ang pagkonsumo ng mga hilaw o kulang sa luto na karne, manok, lamang-dagat, shellfish, o mga itlog ay maaaring magpataas ng panganib sa sakit na dala ng pagkain, lalo na kung ikaw ay may ilang mga medikal na kondisyon.","ui.phoRefill":"Libreng dagdag na pansit na walang limitasyon kapag dito kakain ng pho.","allergen.milk":"Gatas at mga produktong gawa sa gatas","allergen.egg":"Itlog","allergen.fish":"Isda","allergen.shellfish":"Shellfish (hal. hipon, alimango, tahong)","allergen.peanut":"Mani","allergen.treenut":"Mga nuwes mula sa puno","allergen.gluten":"Gluten","allergen.soy":"Soya","allergen.sesame":"Linga","sec.appetizers.title":"Mga pampagana","sec.pho.title":"Pho","sec.pho.intro":"Manipis na pansit na gawa sa bigas sa sabaw ng buto ng baka, na may puting sibuyas, murang dahon ng sibuyas at wansoy. Libreng dagdag na pansit na walang limitasyon kapag dito kakain ng pho.","sec.pho.brothNote":"Lahat ng pho, pati ang may gulay at tokwa, ay gawa sa sabaw ng buto ng baka.","sec.plates.title":"Mga kanin at pansit","sec.extras.title":"Mga dagdag","sec.kids.title":"Para sa mga bata","sec.drinks.title":"Mga inumin","item.bao.name":"Gintong bao","item.bao.tagline":"Pritong bao na may baboy","item.bao.desc":"Giniling na balikat ng baboy, sibuyas na dahan-dahang niluto hanggang kumayumanggi at tumamis, kabute at nilagang itlog na matigas na ang pula, binalot sa masa na gawa namin at pinirito hanggang lumutong.","item.bao.price.three":"Tatlong bao","item.bao.price.one":"Isang bao","item.springroll.name":"Sariwang lumpia","item.springroll.tagline":"Hipon","item.springroll.desc":"Sariwang toge, mint, letsugas at bihon na binalot sa balat na gawa sa bigas. May kasamang sarsa ng mani.","item.eggrolls.name":"Pritong lumpia","item.eggrolls.desc":"Giniling na baboy, kabute, sibuyas, karot at sotanghon, pinirito sa maraming mantika hanggang lumutong. May kasamang inatsarang karot, bihon, letsugas at matamis-asim na sarsang patis.","item.eggrolls.price.three":"Tatlong lumpia","item.eggrolls.price.extra":"Dagdag na isang lumpia (apat na lumpia sa kabuuan)","item.shakenfries.name":"Espesyal na patatas na may ginisang baka","item.shakenfries.desc":"Malalaki at malutong na pritong patatas na may ginisang liempo ng baka, bawang, sibuyas na dahan-dahang niluto hanggang kumayumanggi at tumamis, cheddar na matapang ang lasa at maanghang na tartar sauce.","item.trufflefries.name":"Pritong patatas na may truffle","item.trufflefries.desc":"Malalaki at malutong na pritong patatas na hinaluan ng sariwang mga halamang pampalasa, kesong parmesan at langis ng truffle mula sa Italya. May kasamang maanghang na aji verde aioli, ketsap at maanghang na mayonesa.","item.parmfries.name":"Pritong patatas na may parmesan","item.parmfries.desc":"Malalaki at malutong na pritong patatas na hinaluan ng sariwang mga halamang pampalasa at bawang, na may kesong parmesan sa ibabaw. May kasamang maanghang na aji verde aioli, ketsap at maanghang na mayonesa.","item.wings.name":"Pakpak ng manok","item.wings.desc":"Malutong na pritong pakpak ng manok.","item.wings.note":"May produktong gawa sa gatas ang pakpak na may parmesan.","item.wings.price.garlic":"Bawang","item.wings.price.parmesan":"Parmesan","item.nuggets.name":"Basket ng nuggets ng manok","item.nuggets.desc":"Malutong na nuggets na may malalaki at malutong na pritong patatas, ketsap at maanghang na mayonesa.","item.phoshortrib.name":"Pho na may short rib","item.phoshortrib.tagline":"Walang buto","item.phoshortrib.desc":"Manipis na hiwa ng short rib na walang buto, malasa at sa lambot ay natutunaw sa bibig.","item.phoribbones.name":"Pho na may tadyang na may buto","item.phoribbones.tagline":"Dalawang buto","item.phoribbones.desc":"Tadyang ng baka na marahang niluto sa kaunting likido nang apat na oras, malinamnam at punô ng lasa, na may lamáng madaling humiwalay sa buto.","item.phobeefbelly.name":"Pho na may liempo ng baka","item.phobeefbelly.desc":"Manipis na hiwa ng liempo ng baka na may mga guhit ng taba.","item.phobeefbelly.note":"Espesyal sa tanghalian tuwing Lunes hanggang Biyernes: $11.99, para lang sa pagkain dito, 10 n.u. hanggang 4 n.h.","item.phofilet.name":"Pho na may filet mignon","item.phofilet.desc":"Filet mignon na kaunti ang taba, malambot at malasa.","item.phocombo.name":"Pho na may iba't ibang sangkap","item.phocombo.desc":"Halo ng liempo ng baka, litid, pecho, bola-bola at isang tadyang na may buto.","item.phocombo.note":"Walang pagpapalit ng karne.","item.phoveggie.name":"Pho na may gulay at tokwa","item.phoveggie.desc":"Tokwa, brokoli, karot at petsay Baguio sa malinamnam na sabaw ng baka.","item.phoveggie.note":"Gawa sa sabaw ng baka, kaya hindi ito pagkaing para sa mga vegetarian.","item.phobrisket.name":"Pho na may pecho ng baka","item.phobrisket.desc":"Pecho ng baka na marahang niluto sa kaunting likido nang apat na oras, malambot ngunit bahagyang may kunat.","item.phoshrimp.name":"Pho na may hipon","item.phoshrimp.desc":"Malalaking hipon na marahang niluto sa tubig, magaan at sariwa ang lasa.","item.phomeatballs.name":"Pho na may bola-bola","item.phomeatballs.desc":"Bola-bola na may litid, estilong Biyetnames.","item.phobourdain.name":"Pho Anthony Bourdain","item.phobourdain.desc":"Murang dahon ng sibuyas, pulang sibuyas at tinadtad na bawang na ginisa sa mainit na wok, kasama ang filet mignon at malapad na pansit. May lasang usok at punô ng lasa.","item.drynoodle.name":"Pansit na walang sabaw na may liempo ng baka","item.drynoodle.desc":"Liempo ng baka na ginisa sa sarsang tanglad, inihain sa ibabaw ng sariwang halo ng murang dahon ng mga gulay, mga gulay at malapad na pansit. May binusang mani, pritong maliliit na sibuyas na shallot at sariwang mga halamang pampalasa sa ibabaw. Inihahain nang tuyo, walang sabaw.","addon.shaken.name":"Dagdag na gisa sa pho","addon.shaken.desc":"Bawang, murang dahon ng sibuyas at pulang sibuyas na ginisa sa mainit na wok gamit ang langis ng utak ng buto. Nagdaragdag ng mas malalim na lasang usok para sa natatanging lasa ng hilagang estilo.","addon.sousvide.name":"Dagdag na itlog na sous vide","addon.sousvide.desc":"Itlog na marahang niluto sa tubig nang walang balat, na nagdaragdag ng malinamnam at malakremang lasa sa sabaw.","addon.mala.name":"Dagdag na pamamanhid sa bibig","addon.mala.desc":"Langis ng sili na mala, gawa namin.","addon.spicy.name":"Gawing maanghang ang pho","addon.spicy.desc":"Gawa naming malapot na paste ng sili na may tanglad.","item.lomo.name":"Lomo Saltado","item.lomo.desc":"Makakapal na pritong patatas, matamis na pulang sibuyas na bahagyang pinaitim sa apoy, kamatis at toyo na may puting alak, kasama ang pangunahing sangkap na pinili mo at pinasingawang puting kanin. May kasamang maanghang na aji verde aioli na gawa namin.","item.lomo.note":"May itlog at kesong parmesan ang aji verde aioli, kaya hindi vegan ang sarsang aji verde aioli.","item.lomo.price.filet":"Filet mignon","item.lomo.price.shrimp":"Hipon","item.lomo.price.tofu":"Vegan na tokwa","addon.lomofriedegg.name":"Pritong itlog","addon.lomosoftegg.name":"Malasadong nilagang itlog","item.cajun.name":"Pansit na may bawang at Cajun","item.cajun.desc":"Pansit na gawa sa trigo, hinaluan ng mantikilya at sarsang bawang na Cajun, na may sariwang murang dahon ng sibuyas sa ibabaw. May kasamang maanghang na aji verde aioli na gawa namin.","item.cajun.note":"May shellfish (hal. hipon, alimango, tahong) ang pagkaing may hipon at sausage.","item.cajun.price.shrimpsausage":"Hipon at sausage","item.cajun.price.filet":"Filet mignon","item.friedrice.name":"Sinangag","item.friedrice "ماهی","allergen.shellfish":"صدف‌داران و سخت‌پوستان","allergen.peanut":"بادام‌زمینی","allergen.treenut":"آجیل‌های درختی","allergen.gluten":"گلوتن","allergen.soy":"سویا","allergen.sesame":"کنجد","sec.appetizers.title":"پیش‌غذاها","sec.pho.title":"فو","sec.pho.intro":"نودل‌های نازک برنجی در آبِ استخوان گاو، با پیاز سفید، پیازچه و گشنیز. با سفارش فو برای صرف در رستوران، نودل اضافهٔ رایگان و نامحدود دریافت کنید.","sec.pho.brothNote":"همهٔ فوها، از جمله کاسهٔ سبزیجات و توفو، با آبِ استخوان گاو تهیه می‌شوند.","sec.plates.title":"بشقاب‌های برنج و نودل","sec.extras.title":"موارد اضافی","sec.kids.title":"کودکان","sec.drinks.title":"نوشیدنی‌ها","item.bao.name":"بائوی طلایی","item.bao.tagline":"دامپلینگ سرخ‌شدهٔ گوشت خوک","item.bao.desc":"گوشت چرخ‌کردهٔ شانهٔ خوک، پیاز کاراملی، قارچ و یک تخم‌مرغ آب‌پز سفت، پیچیده‌شده در خمیر تهیه‌شده در رستوران و سرخ‌شده تا ترد شود.","item.bao.price.three":"سه بائو","item.bao.price.one":"یک بائو","item.springroll.name":"رول بهاری","item.springroll.tagline":"میگو","item.springroll.desc":"جوانهٔ تازهٔ لوبیا، نعناع، کاهو و ورمیشل، پیچیده‌شده در کاغذ برنج. همراه با سس بادام‌زمینی.","item.eggrolls.name":"اگ‌رول","item.eggrolls.desc":"گوشت چرخ‌کردهٔ خوک، قارچ، پیاز، هویج و نودل شیشه‌ای، سرخ‌شده در روغن فراوان تا ترد شود. همراه با هویج ترشی، ورمیشل، کاهو و سس ماهی ترش‌وشیرین.","item.eggrolls.price.three":"سه رول","item.eggrolls.price.extra":"افزودن یک رول (در مجموع چهار رول)","item.shakenfries.name":"سیب‌زمینی سرخ‌کردهٔ مخصوص به سبک شِیکن","item.shakenfries.desc":"سیب‌زمینی سرخ‌کردهٔ درشت و ترد با گوشت شکم گاو به سبک شِیکن، سیر، پیاز کاراملی، پنیر چدار با طعم قوی و سس تارتار تند.","item.trufflefries.name":"سیب‌زمینی سرخ‌کرده با ترافل","item.trufflefries.desc":"سیب‌زمینی سرخ‌کردهٔ درشت و ترد، مخلوط با سبزی‌های معطر تازه، پنیر پارمزان و روغن ترافل ایتالیایی. همراه با آیولی تند آجی ورده، کچاپ و مایونز تند.","item.parmfries.name":"سیب‌زمینی سرخ‌کرده با پارمزان","item.parmfries.desc":"سیب‌زمینی سرخ‌کردهٔ درشت و ترد، مخلوط با سبزی‌های معطر تازه و سیر، با پ есть вопросы, обратитесь к официанту.","ui.rawTitle":"Предупреждение о недостаточно приготовленных продуктах","ui.rawNotice":"Блюда с яйцами всмятку, яйцами пашот, глазуньей, яйцами, слегка обжаренными с двух сторон с жидким желтком, а также стейки слабой или средне-слабой прожарки могут быть недостаточно приготовлены. Эти блюда могут подаваться сырыми или не полностью приготовленными либо содержать сырые или не полностью приготовленные ингредиенты. Употребление сырого или полусырого мяса, птицы, морепродуктов, моллюсков, ракообразных или яиц может увеличить риск заболеваний, передающихся с продуктами питания, особенно у людей с определёнными заболеваниями.","ui.phoRefill":"При заказе фо в зале — бесплатная добавка лапши без ограничений.","allergen.milk":"Молоко и молочные продукты","allergen.egg":"Яйца","allergen.fish":"Рыба","allergen.shellfish":"Ракообразные и моллюски","allergen.peanut":"Арахис","allergen.treenut":"Древесные орехи","allergen.gluten":"Глютен","allergen.soy":"Соя","allergen.sesame":"Кунжут","sec.appetizers.title":"Закуски","sec.pho.title":"Фо","sec.pho.intro":"Тонкая рисовая лапша в бульоне из говяжьих костей с белым луком, зелёным луком и кинзой. При заказе фо в зале — бесплатная добавка лапши без ограничений.","sec.pho.brothNote":"Любой фо, включая вариант с овощами и тофу, готовится на бульоне из говяжьих костей.","sec.plates.title":"Блюда с рисом и лапшой","sec.extras.title":"Дополнительно","sec.kids.title":"Детское меню","sec.drinks.title":"Напитки","item.bao.name":"Золотой бао","item.bao.tagline":"Жареный пирожок со свининой","item.bao.desc":"Фарш из свиной лопатки, карамелизованный лук, грибы и яйцо вкрутую в тесте собственного приготовления, обжаренном до хрустящей корочки.","item.bao.price.three":"Три бао","item.bao.price.one":"Один бао","item.springroll.name":"Спринг-ролл","item.springroll.tagline":"Креветка","item.springroll.desc":"Свежие ростки бобов, мята, салат и вермишель в рисовой бумаге. Подаётся с арахисовым соусом.","item.eggrolls.name":"Эгг-роллы","item.eggrolls.desc":"Свиной фарш, грибы, лук, морковь и стеклянная лапша, обжаренные во фритюре до хрустящей корочки. Подаются с маринованной морковью, вермишелью, салатом и кисло-сладким рыбным соусом.","item.eggrolls.price.three":"Три ролла","item.eggrolls.price.extra":"Добавить один ролл (всего четыре)","item.shakenfries.name":"Фирменный картофель фри в стиле шейкен","item.shakenfries.desc":"Крупный хрустящий картофель фри с говядиной из брюшной части в стиле шейкен, чесноком, карамелизованным луком, насыщенным чеддером и острым соусом тартар.","item.trufflefries.name":"Трюфельный картофель фри","item.trufflefries.desc":"Крупный хрустящий картофель фри со свежими травами, пармезаном и итальянским трюфельным маслом. Подаётся с острым айоли ахи-верде, кетчупом и острым майонезом.","item.parmfries.name":"Картофель фри с пармезаном","item.parmfries.desc":"Крупный хрустящий картофель фри со свежими травами и чесноком, посыпанный пармезаном. Подаётся с острым айоли ахи-верде, кетчупом и острым майонезом.","item.wings.name":"Куриные крылышки","item.wings.desc":"Хрустящие жареные куриные крылышки.","item.wings.note":"Крылышки с пармезаном содержат молочные продукты.","item.wings.price.garlic":"Чеснок","item.wings.price.parmesan":"Пармезан","item.nuggets.name":"Корзинка куриных наггетсов","item.nuggets.desc":"Хрустящие наггетсы с крупным хрустящим картофелем фри, кетчупом и острым майонезом.","item.phoshortrib.name":"Фо с короткими рёбрами","item.phoshortrib.tagline":"Без костей","item.phoshortrib.desc":"Тонко нарезанное мясо коротких рёбер без костей, с насыщенным вкусом, нежное и тающее во рту.","item.phoribbones.name":"Фо с рёбрами на кости","item.phoribbones.tagline":"Две кости","item.phoribbones.desc":"Говяжьи рёбра, тушённые четыре часа до насыщенного, глубокого вкуса; мясо легко отделяется от кости.","item.phobeefbelly.name":"Фо с говядиной из брюшной части","item.phobeefbelly.desc":"Тонкие ломтики мраморной говядины из брюшной части.","item.phobeefbelly.note":"Обеденное предложение по будням: $11.99, только в зале, с 10 утра до 4 дня.","item.phofilet.name":"Фо с филе-миньоном","item.phofilet.desc":"Нежный и ароматный нежирный филе-миньон.","item.phocombo.name":"Фо ассорти","item.phocombo.desc":"Сочетание говядины из брюшной части, сухожилий, грудинки, мясного шарика и одного ребра на кости.","item.phocombo.note":"Замена мясных компонентов не предусмотрена.","item.phoveggie.name":"Фо с овощами и тофу","item.phoveggie.desc":"Тофу, брокколи, морковь и пекинская капуста в насыщенном говяжьем бульоне.","item.phoveggie.note":"Это блюдо готовится на говяжьем бульоне, поэтому оно не вегетарианское.","item.phobrisket.name":"Фо с грудинкой","item.phobrisket.desc":"Грудинка, тушённая четыре часа: нежная, с лёгкой упругостью.","item.phoshrimp.name":"Фо с креветками","item.phoshrimp.desc":"Крупные креветки, приготовленные при слабом нагреве в жидкости, — лёгкие и свежие.","item.phomeatballs.name":"Фо с мясными шариками","item.phomeatballs.desc":"Вьетнамские мясные шарики с сухожилиями.","item.phobourdain.name":"Фо «Энтони Бурден»","item.phobourdain.desc":"Обжаренные в воке зелёный лук, красный лук и рубленый чеснок с филе-миньоном и плоской лапшой. Дымный аромат и насыщенный вкус.","item.drynoodle.name":"Лапша без бульона с говядиной из брюшной части","item.drynoodle.desc":"Быстро обжаренная говядина из брюшной части в соусе с лемонграссом на свежем миксе салатных листьев, овощах и плоской лапше. С жареным арахисом, жареным шалотом и свежими травами. Подаётся без супа.","addon.shaken.name":"Сделайте фо в стиле шейкен","addon.shaken.desc":"Чеснок, зелёный и красный лук, обжаренные в воке на масле костного мозга. Придаёт глубокий дымный аромат и характерный вкус в северном стиле.","addon.sousvide.name":"Добавить яйцо су-вид","addon.sousvide.desc":"Медленно приготовленное яйцо пашот придаёт бульону насыщенность, напоминающую молоко.","addon.mala.name":"Добавить ощущение онемения","addon.mala.desc":"Масло чили мала собственного приготовления.","addon.spicy.name":"Сделайте фо острым","addon.spicy.desc":"Паста чили с лемонграссом собственного приготовления.","item.lomo.name":"Ломо сальтадо","item.lomo.desc":"Толсто нарезанный картофель фри, поджаренный до подпалин сладкий красный лук, помидоры и соевый соус с белым вином, с филе-миньоном, креветками или тофу на выбор и белым рисом на пару. Подаётся с острым айоли ахи-верде собственного приготовления.","item.lomo.note":"Айоли ахи-верде содержит яйца и сыр пармезан, поэтому соус айоли ахи-верде не является веганским.","item.lomo.price.filet":"Филе-миньон","item.lomo.price.shrimp":"Креветки","item.lomo.price.tofu":"Веганский тофу","addon.lomofriedegg.name":"Жареное яйцо","addon.lomosoftegg.name":"Яйцо всмятку","item.cajun.name":"Лапша с чесноком по-каджунски","item.cajun.desc":"Пшеничная лапша со сливочным маслом и каджунским чесночным соусом, со свежим зелёным луком. Подаётся с острым айоли ахи-верде собственного приготовления.","item.cajun.note":"Вариант с креветками и колбасой содержит аллерген «Ракообразные и моллюски».","item.cajun.price.shrimpsausage":"Креветки и колбаса","item.cajun.price.filet":"Филе-миньон","item.friedrice.name":"Жареный рис","item.friedrice.desc":"Мясо, креветки или тофу на выбор с яичницей-болтуньей и зелёным луком. Острый айоли ахи-верде собственного приготовления подаётся отдельно.","item.friedrice.note":"Вариант с креветками содержит аллерген «Ракообразные и моллюски». Варианты с тофу содержат сою. Куриные крылышки покрыты пшеничной панировкой.","item.friedrice.price.shrimp":"Креветки","item.friedrice.price.spam":"Spam","item.friedrice.price.wings":"Куриные крылышки","item.friedrice.price.filet":"Филе-миньон","item.friedrice.price.softtofu":"Мягкий тофу","item.friedrice.price.friedtofu":"Жареный тофу","item.kimchi.name":"Жареный рис с кимчи","item.kimchi.desc":"Фирменный жареный рис с кимчи, яичницей-болтуньей и зелёным луком. Острый айоли ахи-верде собственного приготовления подаётся отдельно.","item.kimchi.note":"Кимчи обычно ферментируют с рыбным соусом и солёными креветками. Вариант с мягким тофу содержит сою.","item.kimchi.price.spam":"Spam","item.kimchi.price.softtofu":"Мягкий тофу","item.kimchi.price.filet":"Филе-миньон","item.sidenoodles.name":"Лапша дополнительно","item.sidenoodles.desc":"Без ограничений при заказе фо в зале.","item.sidebroth.name":"Бульон дополнительно","item.siderice.name":"Рис дополнительно","item.friedegg.name":"Жареное яйцо","item.poachedegg.name":"Медленно приготовленное яйцо пашот","item.soybutter.name":"Лапша с соевым соусом и сливочным маслом","item.kidsbox.name":"Детский набор в коробке","item.kidsbox.desc":"Хрустящие золотистые куриные наггетсы и картофель фри с приправами, с пакетиком сока в дополнение к блюду.","item.yuzupeach.name":"Юдзу и персик","item.herbaltea.name":"Травяной чай со льдом","item.herbaltea.desc":"Смесь пандана и артишока.","item.thaitea.name":"Тайский чай со льдом","item.thaitea.desc":"Сладкий и сливочный, с выраженными нотами чёрного чая.","item.lychee.name":"Лимонад или газированный напиток с личи","item.lychee.desc":"Личи, смешанный с лимонадом или газированным напитком.","item.vietcoffee.name":"Вьетнамский кофе со льдом","item.strawberrysoda.name":"Клубничная крем-сода","item.watermelon.name":"Освежающий арбузный напиток","item.passionfruit.name":"Зелёный чай с маракуйей","item.passionfruit.desc":"Зелёный чай с жасмином и пюре маракуйи.","item.fountain.name":"Напиток из автомата","item.fountain.desc":"Coke, Diet Coke, Coke Zero, клубничная Фанта, имбирный эль, рутбир Barq's, Sprite или лимонад.","item.shirley.name":"Ширли Темпл","item.royrogers.name":"Рой Роджерс","item.jasmineiced.name":"Жасминовый чай со льдом","item.jasminehot.name":"Горячий жасминовый чай","ui.skip":"Перейти к меню","ui.allergens":"Аллергены","ui.matchAny":"Отмечаются блюда, содержащие хотя бы один из выбранных аллергенов.","ui.chooseAllergens":"Выберите аллергены, которых хотите избегать","ui.sectionHidden":"Все блюда в этом разделе  संभव कोशिश करते हैं, लेकिन क्रॉस-कंटैमिनेशन हमेशा संभव है और हम एलर्जी पैदा करने वाले पदार्थों से पूरी तरह मुक्त वातावरण की गारंटी नहीं दे सकते। कोई भी सवाल हो तो कृपया अपने सर्वर से पूछें।","ui.rawTitle":"अधपके भोजन संबंधी सूचना","ui.rawNotice":"नरम उबले अंडे, बिना छिलके पानी में पोच किए अंडे, एक तरफ़ से तले अंडे या दोनों तरफ़ से हल्के तले हुए तरल ज़र्दी वाले अंडों से बने व्यंजन, और कम पके या कम से मध्यम पके स्टेक, अधपके हो सकते हैं। ये व्यंजन कच्चे या अधपके परोसे जा सकते हैं या इनमें कच्ची या अधपकी सामग्री हो सकती है। कच्चे या अधपके मांस, मुर्गी व अन्य पालतू पक्षियों के मांस, समुद्री भोजन, शेलफ़िश या अंडे खाने से आपको भोजन से होने वाली बीमारी होने का जोखिम बढ़ सकता है, खास तौर पर यदि आपको कुछ चिकित्सकीय स्थितियाँ हों।","ui.phoRefill":"रेस्तराँ में बैठकर फ़ो खाने पर नूडल्स का मुफ़्त और असीमित रीफ़िल।","allergen.milk":"दूध और दुग्ध उत्पाद","allergen.egg":"अंडा","allergen.fish":"मछली","allergen.shellfish":"शेलफ़िश (क्रस्टेशियन और मोलस्क)","allergen.peanut":"मूंगफली","allergen.treenut":"ट्री-नट (बादाम, अखरोट आदि)","allergen.gluten":"ग्लूटेन","allergen.soy":"सोयाबीन","allergen.sesame":"तिल","sec.appetizers.title":"शुरुआती व्यंजन","sec.pho.title":"फ़ो","sec.pho.intro":"गोमांस की हड्डियों के शोरबे में परोसे गए पतले चावल के नूडल्स, ऊपर से सफ़ेद प्याज़, हरा प्याज़ और हरा धनिया। रेस्तराँ में बैठकर फ़ो खाने पर नूडल्स का मुफ़्त और असीमित रीफ़िल।","sec.pho.brothNote":"हर फ़ो, सब्ज़ियों और टोफ़ू वाले कटोरे सहित, गोमांस की हड्डियों के शोरबे से बनाया जाता है।","sec.plates.title":"चावल और नूडल्स की प्लेटें","sec.extras.title":"अतिरिक्त चीज़ें","sec.kids.title":"बच्चों के लिए","sec.drinks.title":"पेय","item.bao.name":"सुनहरा बाओ","item.bao.tagline":"सूअर के मांस वाला तला हुआ डम्पलिंग","item.bao.desc":"सूअर के कंधे का कीमा, कैरेमलाइज़ किया प्याज़, मशरूम और पूरी तरह उबला अंडा, रेस्तराँ में बने आटे की परत में लपेटकर कुरकुरा तला हुआ।","item.bao.price.three":"तीन बाओ","item.bao.price.one":"एक बाओ","item.springroll.name":"स्प्रिंग रोल","item.springroll.tagline":"झींगा","item.springroll. y.desc":"गोमांस के पेट वाले हिस्से के पतले टुकड़े, जिनमें चर्बी की धारियाँ हैं।","item.phobeefbelly.note":"सप्ताह के कार्यदिवसों की खास लंच पेशकश: $11.99, केवल रेस्तराँ में बैठकर खाने के लिए, सुबह 10 बजे से शाम 4 बजे तक।","item.phofilet.name":"फ़िले मिन्यों फ़ो","item.phofilet.desc":"कम चर्बी वाला फ़िले मिन्यों, नरम और स्वाद से भरपूर।","item.phocombo.name":"मिक्स फ़ो","item.phocombo.desc":"गोमांस के पेट का मांस, कंडरा, सीने का मांस, मीटबॉल और हड्डी सहित एक पसली का मिश्रण।","item.phocombo.note":"इसमें इस्तेमाल किए गए मांस को बदला नहीं जा सकता।","item.phoveggie.name":"सब्ज़ियों और टोफ़ू का फ़ो","item.phoveggie.desc":"टोफ़ू, ब्रोकोली, गाजर और नापा पत्तागोभी, भरपूर स्वाद वाले गोमांस के शोरबे में।","item.phoveggie.note":"यह कटोरा गोमांस के शोरबे से बनाया जाता है, इसलिए यह शाकाहारी नहीं है।","item.phobrisket.name":"ब्रिस्केट फ़ो","item.phobrisket.desc":"सीने का मांस, थोड़े तरल में ढककर चार घंटे धीमी आँच पर पकाया गया; नरम, पर चबाने में हल्की कसावट के साथ।","item.phoshrimp.name":"झींगा फ़ो","item.phoshrimp.desc":"तरल में धीमे पकाए बड़े झींगे, हल्के और ताज़े।","item.phomeatballs.name":"मीटबॉल फ़ो","item.phomeatballs.desc":"कंडरे वाले वियतनामी मीटबॉल।","item.phobourdain.name":"एंथनी बोर्डेन फ़ो","item.phobourdain.desc":"वॉक में तेज़ आँच पर भूना हरा प्याज़, लाल प्याज़ और बारीक कटा लहसुन, फ़िले मिन्यों और चपटे नूडल्स के साथ। धुएँ जैसा स्वाद लिए हुए और स्वाद से भरपूर।","item.drynoodle.name":"बीफ़ बेली सूखे नूडल्स","item.drynoodle.desc":"लेमनग्रास सॉस में तेज़ आँच पर चलाकर पकाया गोमांस के पेट का मांस, ताज़े मिश्रित सलाद पत्तों, सब्ज़ियों और चपटे नूडल्स पर परोसा जाता है। ऊपर से भुनी मूंगफली, तले शैलट और ताज़ी हर्ब्स। सूखा, बिना सूप के परोसा जाता है।","addon.shaken.name":"अपने फ़ो को शेकन शैली में बनवाएँ","addon.shaken.desc":"अस्थि-मज्जा के तेल में वॉक पर तेज़ आँच में भूना लहसुन, हरा प्याज़ और लाल प्याज़। उत्तरी शैली के खास स्वाद के लिए धुएँ जैसा गहरा स्वाद जोड़ता है।","addon.sousvide.name":"सू-वीड अंडा जोड़ें","addon.sousvide.desc":"धीरे पोच किया अंडा, जो आपके शोरबे में दूध जैसी भ   LB.bg.animate([{ opacity: bgFrom }, { opacity: 0 }], { duration: ms, easing: "ease-out", fill: "forwards" });
  return ms;
}
function lbAfterClose() {
  lbCancelGesture(); LB.session++;
  LB.zooms.forEach(z => { z.getAnimations().forEach(a => a.cancel()); z.style.transition = "none"; z.style.transform = ""; });
  LB.bg.getAnimations().forEach(a => a.cancel()); LB.chrome.getAnimations().forEach(a => a.cancel());
  LB.bg.style.opacity = 0; LB.chrome.style.opacity = 1; LB.chrome.classList.remove("off"); LB.chromeOn = true;
  LB.track.classList.remove("zoomed"); LB.exit = null;
}
function lbStartPinch(now) {
  const [a, b] = [...LB.pointers.values()];
  LB.gest = { mode: "pinch", d0: Math.max(dist(a, b), 1), m0: mid(a, b), s0: LB.s, tx0: LB.tx, ty0: LB.ty, t0: now, x0: a.x, y0: a.y, samples: [] };
}
function lbVelocity(g, now, x, y) {
  g.samples.push([now, x, y]);
  const s1 = g.samples[g.samples.length - 1];
  const s0 = g.samples.find(s => now - s[0] <= 100);
  if (!s0 || s1[0] - s0[0] < 8) return { vx: 0, vy: 0 };
  const dt = (s1[0] - s0[0]) / 1000;
  return { vx: (s1[1] - s0[1]) / dt, vy: (s1[2] - s0[2]) / dt };
}
LB.track.addEventListener("pointerdown", e => {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  if (LB.pointers.size >= 2 && !LB.pointers.has(e.pointerId)) return;
  try { LB.track.setPointerCapture(e.pointerId); } catch (err) {}
  LB.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const now = performance.now();
  if (LB.pointers.size === 1) LB.gest = { x0: e.clientX, y0: e.clientY, t0: now, tx0: LB.tx, ty0: LB.ty, mode: null, samples: [[now, e.clientX, e.clientY]] };
  else {
    const g = LB.gest;
    if (g && g.mode === "drag") lbSpringBack();
    lbCancelTap(); lbStartPinch(now);
  }
});
LB.track.addEventListener("pointermove", e => {
  if (!LB.pointers.has(e.pointerId) || !LB.gest) return;
  LB.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const g = LB.gest, now = performance.now();
  if (g.mode === "done") return;
  if (g.mode === "pinch") {
    if (LB.pointers.size < 2) return;
    const [a, b] = [...LB.pointers.values()]; const m = mid(a, b);
    const s = clamp(g.s0 * dist(a, b) / g.d0, 1, 4), bd = lbBounds(s);
    const cx = (g.m0.x - vw() / 2 - g.tx0) / g.s0, cy = (g.m0.y - vh() / 2 - g.ty0) / g.s0;
    lbSetZoom(LB.index, s, clamp(m.x - vw() / 2 - cx * s, -bd.x, bd.x), clamp(m.y - vh() / 2 - cy * s, -bd.y, bd.y), false);
    return;
  }
  if (LB.pointers.size !== 1) return;
  const dx = e.clientX - g.x0, dy = e.clientY - g.y0;
  g.samples.push([now, e.clientX, e.clientY]); if (g.samples.length > 8) g.samples.shift();
  if (LB.s > 1.01) {
    if (!g.mode) { if (Math.hypot(dx, dy) < 6) return; g.mode = "pan"; lbCancelTap(); }
    const bd = lbBounds(LB.s); lbSetZoom(LB.index, LB.s, clamp(g.tx0 + dx, -bd.x, bd.x), clamp(g.ty0 + dy, -bd.y, bd.y), false); return;
  }
  if (!g.mode) { if (Math.hypot(dx, dy) < 14) return; g.mode = "drag"; lbCancelTap(); }
  if (g.mode === "drag") lbDrag(dx, dy);
});
function lbPointerEnd(e) {
  if (!LB.pointers.has(e.pointerId)) return;
  LB.pointers.delete(e.pointerId);
  if (e.type === "pointercancel") lbCancelTap();
  const g = LB.gest; if (!g) return;
  const now = performance.now();
  if (g.mode === "pinch") {
    if (LB.pointers.size >= 2) { lbStartPinch(now); return; }
    if (LB.s < 1.01) lbSetZoom(LB.index, 1, 0, 0, true);
    if (LB.pointers.size === 1) { const p = [...LB.pointers.values()][0]; LB.gest = { x0: p.x, y0: p.y, t0: now, tx0: LB.tx, ty0: LB.ty, mode: LB.s > 1.01 ? "pan" : "done", samples: [] }; }
    else LB.gest = null;
    return;
  }
  LB.gest = null;
  if (g.mode === "pan" || g.mode === "done") return;
  const dx = e.clientX - g.x0, dy = e.clientY - g.y0;
  const v = lbVelocity(g, now, e.clientX, e.clientY);
  if (g.mode === "drag") {
    const d = Math.hypot(dx, dy), flick = Math.hypot(dx + v.vx * .25, dy + v.vy * .25);
    if (d > 60 || (e.type === "pointerup" && flick > 300)) { LB.exit = { fling: { dx, dy } }; closeDialog(LB.dlg); }
    else lbSpringBack();
    return;
  }
  if (e.type === "pointerup" && Math.hypot(dx, dy) < 10 && now - g.t0 < 350) lbTap(e.clientX, e.clientY);
}
LB.track.addEventListener("pointerup", lbPointerEnd);
LB.track.addEventListener("pointercancel", lbPointerEnd);
$("lbClose").addEventListener("click", () => closeDialog(LB.dlg));
$("lbPrev").addEventListener("click", () => lbGoto(LB.index - 1, true));
$("lbNext").addEventListener("click", () => lbGoto(LB.index + 1, true));
document.addEventListener("keydown", e => {
  document.querySelectorAll(".pointer-focus").forEach(b => b.classList.remove("pointer-focus"));
  if (!LB.dlg.open || LB.dlg.classList.contains("closing")) return;
  if (e.key === "ArrowRight") { e.preventDefault(); lbGoto(LB.index + (isRTL() ? -1 : 1), true); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); lbGoto(LB.index + (isRTL() ? 1 : -1), true); }
});
window.addEventListener("resize", () => {
  if (!LB.dlg.open) return;
  lbCancelGesture();
  [...LB.zooms, LB.bg, LB.chrome].forEach(el => el.getAnimations().forEach(a => a.finish()));
  lbLayout(); lbSetZoom(LB.index, 1, 0, 0, false); lbPlaceTrack(false);
});
$("main").addEventListener("click", e => {
  const b = e.target.closest("[data-photo]"); if (!b) return;
  if (navigator.vibrate) navigator.vibrate(10);
  lbOpen(+b.dataset.photo, b, e.detail === 0);
});

if ("ResizeObserver" in window) new ResizeObserver(syncBarHeight).observe($("bar"));
state.lang = pickLang();
(load("sup-avoid") || "").split(",").filter(a => ORDER.includes(a)).forEach(a => state.avoid.add(a));
const sharedFilter = new URLSearchParams(location.search);
if (sharedFilter.has("avoid")) { state.avoid.clear(); sharedFilter.get("avoid").split(",").filter(a => ORDER.includes(a)).forEach(a => state.avoid.add(a)); state.hide = state.avoid.size > 0 && sharedFilter.get("hide") === "1"; }
/* A menu always opens at the top. A leftover fragment from a tapped special, or a scroll position the browser
   restores, would otherwise drop a diner into the middle of the menu. */
if ("scrollRestoration" in history) history.scrollRestoration = "manual";
if (location.hash) { const u = new URL(location.href); u.hash = ""; history.replaceState(history.state, "", u); }
render();
if (state.avoid.size) syncFilterUrl();
window.scrollTo(0, 0);
startOffline();
addEventListener("pageshow", e => { if (e.persisted) window.scrollTo(0, 0); });
</script>

/* Aggregate, cookieless visit counts (Cloudflare Web Analytics). Inert while the

   site token here to switch counting on for every language and location. */
(() => {
  const ANALYTICS_TOKEN = "";
  if (!ANALYTICS_TOKEN) return;
